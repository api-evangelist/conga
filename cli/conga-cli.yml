generated: '2026-08-13'
method: searched
source: https://www.npmjs.com/package/@conga-cloud/graphql
description: >-
  Conga ships no general-purpose CLI for the Advantage Platform. The one
  first-party command-line tool it publishes is bundled inside the
  @conga-cloud/graphql npm package: a code-generation command that logs the
  developer in through the regional Conga OIDC service and generates TypeScript
  types from the caller's own tenant GraphQL schema. It is a build-time developer
  tool, not an operational CLI - there are no commands for users, contracts,
  carts, packages or any other platform resource.
clis:
- name: '@conga-cloud/graphql'
  official: true
  package: '@conga-cloud/graphql'
  registry: npm
  version: 1.0.25
  published: '2026-07-07'
  install:
  - npm install @conga-cloud/graphql
  - npx @conga-cloud/graphql generate
  bin: '@conga-cloud/graphql'
  commands:
  - command: generate
    summary: Generate TypeScript types from the tenant's GraphQL schema.
    steps:
    - Prompts for an environment - Development, QA, Staging or Production.
    - Opens a browser for OIDC login against that environment's Conga login service.
    - Captures the authentication token.
    - Generates types for the corresponding environment and tenant.
    output: src/types/graphql.ts
    note: >-
      The command exists because the schema is per-tenant - see
      graphql/conga-graphql.yml.
  environments:
  - {name: Production, auth_url: 'https://login-rls.congacloud.com/api/v1/auth'}
  - {name: QA, auth_url: 'https://login-rlsqa.congacloud.io/api/v1/auth'}
  - {name: Staging, auth_url: 'https://login-rlsqa.congacloud.io/api/v1/auth'}
  - {name: Development, auth_url: 'https://login-rlsdev.congacloud.io/api/v1/auth'}
rest_cli:
  exists: false
  note: >-
    No CLI covers the 2,136-operation REST surface. Searched npm, PyPI,
    Homebrew-visible releases and the developer portal; nothing published.
binary_distribution: packages/conga-packages.yml
