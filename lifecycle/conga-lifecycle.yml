tenant_deprecation_tooling:
  note: >-
    Conga exposes deprecation as a first-class operation on customer metadata -
    PATCH /api/schema/v1/objects/{objectName}/deprecate and
    PATCH /api/schema/v1/objects/{objectName}/fields/{fieldName}/deprecate let a
    tenant deprecate its own objects and fields. Conga gives its customers a
    deprecation mechanism it does not use for its own public API.
