  packages/conga-packages.yml (@conga-cloud/graphql)
description: >-
  Conga runs three overlapping projections of one revenue-lifecycle data core: a
  2,136-operation REST surface documented on developer.conga.com, a hosted MCP
  server at /mcp on every regional gateway, and a per-tenant GraphQL endpoint the
  first-party @conga-cloud/graphql SDK talks to. This crosswalk records the
  surfaces and what could and could not be bound. It contains NO tool-to-operation
  rows, because both non-REST surfaces are authentication-gated and neither Conga
  nor any published artifact names a single MCP tool or GraphQL type. Mapping them
  by guesswork would assert an agent capability nobody has verified.
surfaces:
  openapi:
    path: openapi/
    documents: 31
    operations: 2136
    gated: false
    note: Published as per-operation OpenAPI fragments on the ReadMe developer portal.
  mcp:
    url: https://rls.congacloud.com/mcp
    gated: true
    gate: OAuth 2.1 bearer; tools/list returns 401 invalid_token
    tools_enumerated: 0
    note: See mcp/conga-mcp.yml. Undocumented by the provider; discovered via an OIDC scope.
  graphql:
    endpoint: <tenant instance URL from the JWT c_org_iurl claim> + /api/graphql/
    gated: true
    gate: >-
      There is no fixed public GraphQL URL. The @conga-cloud/graphql SDK decodes
      the access token and reads the tenant's instance URL out of the c_org_iurl
      claim, so introspection is impossible without a Conga tenant login.
    schema_is_per_tenant: true
    note: See graphql/conga-graphql.yml.
