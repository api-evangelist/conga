method: probed
source: https://rls.congacloud.com/.well-known/oauth-protected-resource/mcp
name: Conga Advantage Platform MCP Server
status: live
description: >-
  Conga runs a hosted, remote Model Context Protocol server at /mcp on every
  regional Conga Advantage Platform gateway. It is undocumented on
  developer.conga.com and does not appear on conga.com, but it is unambiguously
  real and correctly implemented: the endpoint answers MCP JSON-RPC over HTTP,
  rejects anonymous calls with an RFC 6750 WWW-Authenticate challenge carrying a
  resource_metadata pointer, and serves RFC 9728 OAuth Protected Resource
  Metadata at /.well-known/oauth-protected-resource/mcp naming the region's own
  Conga login service as the authorization server. The tool list therefore
  requires an authenticated MCP client; it could not be enumerated anonymously
  and is NOT reproduced here.
discovery:
  found_via: >-
    The Australian Conga login service advertises the MCP resource as an OAuth
    scope in its OIDC discovery document
    (https://login.congacloud.au/api/v1/auth/.well-known/openid-configuration
    lists the scope "https://rls-preview.congacloud.au/mcp"), which led to
    probing /mcp on every regional gateway.
  documented_by_provider: false
deployment:
  mode: remote
  endpoint: https://rls.congacloud.com/mcp
  auth: oauth
  verified: probed
endpoints:
- region: NA
  url: https://rls.congacloud.com/mcp
  authorization_server: https://login-rls.congacloud.com/api/v1/auth
  resource_metadata: https://rls.congacloud.com/.well-known/oauth-protected-resource/mcp
  status: 200 (resource metadata), 401 invalid_token (tools/list)
