transport:
  protocol: Streamable HTTP (JSON-RPC 2.0 over POST)
  accept: application/json, text/event-stream
  get_method: 405 Method Not Allowed (POST-only)
authorization:
  scheme: OAuth 2.1 bearer
  bearer_methods_supported: [header]
  scopes_supported_on_resource: []
  dynamic_client_registration: >-
    Implied by the server's own error text - "Your client should automatically
    re-register and obtain new tokens" - but the authorization server publishes
    no registration_endpoint in its OIDC discovery document, so DCR could not be
    confirmed.
  authorization_server_metadata: https://login-rls.congacloud.com/api/v1/auth/.well-known/openid-configuration
  grant_types_supported: [authorization_code, client_credentials, refresh_token, implicit,
    password, 'urn:ietf:params:oauth:grant-type:device_code', 'urn:openid:params:grant-type:ciba',
    'urn:ietf:params:oauth:grant-type:token-exchange']
  pkce: [S256, plain]
tools:
  enumerated: false
  reason: >-
    tools/list returns HTTP 401 invalid_token without a bearer token. Conga
    publishes no llms.txt tool list, no MCP documentation page and no client
    config snippet, so there is no published fallback list either. Tool names and
    inputSchemas require authenticated introspection with a Conga tenant token.
  do_not_infer: >-
    A candidate tool list was deliberately NOT derived from the 2,136 OpenAPI
    operations - the MCP surface is a curated projection, not a 1:1 REST mirror,
    and inventing tool names would misrepresent what an agent can actually call.
