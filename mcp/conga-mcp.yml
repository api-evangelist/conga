- url: https://rls.congacloud.com/mcp
  method: POST
  body: '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
  http_status: 401
  content_type: application/json
  www_authenticate: >-
    Bearer error="invalid_token", error_description="Authentication failed. The
    provided bearer token is invalid, expired, or no longer recognized by the
    server...", resource_metadata="https://rls.congacloud.com/.well-known/oauth-protected-resource/mcp"
- url: https://rls.congacloud.com/.well-known/oauth-protected-resource/mcp
  method: GET
  http_status: 200
  content_type: application/json
  body: '{"resource":"https://rls.congacloud.com/mcp","authorization_servers":["https://login-rls.congacloud.com/api/v1/auth"],"scopes_supported":[],"bearer_methods_supported":["header"]}'
- url: https://rls.congacloud.com/nonsense-path-xyz123
  method: GET
  http_status: 200
  content_type: text/html
  note: >-
    Host discrimination check. An unknown path on the same host returns a generic
    SPA shell and /.well-known/security.txt returns a Kong "no Route matched"
    404, while /mcp returns an MCP-specific 401 JSON-RPC error and its
    resource-metadata path returns real RFC 9728 JSON. The MCP surface is
    therefore genuinely routed, not a catch-all false positive.
