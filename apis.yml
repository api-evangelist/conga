aid: conga
name: Conga
description: >-
  Conga (formerly Apttus + Conga) is an enterprise Revenue Lifecycle Management
  vendor whose Conga Advantage Platform unifies Configure-Price-Quote (CPQ),
  Contract Lifecycle Management (CLM), document generation and e-signature,
  X-Author authoring, and AI-assisted contract intelligence. The platform
  exposes a broad RESTful API surface (CLM, cart/CPQ, catalog, user-management,
  document- and conversion-management, e-sign, search, scheduler, and
  extensibility services) documented on a public ReadMe-hosted developer portal
  at developer.conga.com. APIs use OAuth 2.0 bearer tokens minted through
  region-specific Conga login services, JSON request/response bodies, cursor-free
  page/limit pagination with Content-Range headers, URI filtering, and a JSON:API
  error envelope. Conga is backed by ICONIQ Capital and Insight Partners.
