aid: conga
name: Conga
description: >-
  Conga (formerly Apttus + Conga) is an enterprise Revenue Lifecycle Management
  vendor whose Conga Advantage Platform unifies Configure-Price-Quote (CPQ),
  Contract Lifecycle Management (CLM), document generation and e-signature,
  X-Author authoring, approvals, billing and incentives, and AI-assisted contract
  intelligence. It is one of the largest documented API surfaces in the catalog:
  Conga publishes a complete OpenAPI 3.0.1 definition for every operation on its
  ReadMe-hosted developer portal at developer.conga.com - 2,136 operations across
  31 services, captured here in openapi/. The platform is regionally partitioned
  (NA/EU/AU), secured with OAuth 2.0 bearer tokens minted from region-specific
  Conga login services that publish OIDC discovery and a real per-service scope
  set (api.cart, api.catalog, api.quote, api.order, api.user-management,
  api.revenue-admin, sign, doc-gen.composer and more), and uses JSON bodies,
  page/limit pagination with Content-Range headers, URI filter functions and a
  JSON:API-style error envelope. Conga also runs two machine surfaces it
  documents nowhere: a hosted, OAuth-gated MCP server at /mcp on every regional
  gateway, and a multi-tenant GraphQL API evidenced only by its own first-party
  npm client @conga-cloud/graphql. Conga is backed by ICONIQ Capital and Insight
  Partners.
