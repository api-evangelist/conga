apis:
- name: Conga Advantage Platform MCP Server
  description: >-
    A hosted, remote Model Context Protocol server on every regional Conga Advantage Platform gateway.
    It answers MCP JSON-RPC over Streamable HTTP, rejects anonymous calls with an RFC 6750 bearer challenge,
    and publishes RFC 9728 OAuth Protected Resource Metadata naming the region's Conga login service as
    the authorization server. Conga does not document it anywhere on its developer portal - it was found
    because the Australian login service advertises the MCP resource as an OAuth scope. The tool list
    requires an authenticated Conga tenant token and was not enumerated.
  humanURL: https://developer.conga.com/
  baseURL: https://rls.congacloud.com/mcp
  tags:
  - MCP
  - Agents
  - Revenue Lifecycle Management
  properties:
  - type: MCPServer
    url: mcp/conga-mcp.yml
  - type: ToolCrosswalk
    url: mcp/conga-tool-crosswalk.yml
  - type: Authentication
    url: authentication/conga-authentication.yml
  - type: OAuthScopes
    url: scopes/conga-scopes.yml
- name: Conga GraphQL API
  description: >-
    A multi-tenant GraphQL API over the Conga Advantage Platform data core, with Relay-style connections,
    cursor pagination, SOQL-like where predicates and Server-Sent-Event subscriptions. Each tenant gets
    its own schema derived from its own object metadata, so there is no fixed public endpoint - Conga's
    own client decodes the access token and reads the tenant instance URL from the c_org_iurl claim. Evidenced
    entirely by Conga's first-party npm client @conga-cloud/graphql; undocumented on the developer portal.
  humanURL: https://www.npmjs.com/package/@conga-cloud/graphql
  baseURL: https://rls.congacloud.com
  tags:
  - GraphQL
  - Revenue Lifecycle Management
  - CPQ
  properties:
  - type: GraphQL
    url: graphql/conga-graphql.yml
  - type: Packages
    url: packages/conga-packages.yml
  - type: Authentication
    url: authentication/conga-authentication.yml
