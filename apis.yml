  date: '2026-08-13'
  status: enriched
  artifacts_added: 52
  pass: local-v1
  note: >-
    Contract discovery beat a bot-challenged docs host - developer.conga.com
    returns 429 to non-browser clients on HTML, but every reference page has a
    machine-readable .md twin carrying a self-contained OpenAPI document. 2,142
    of 2,169 twins were harvested and merged into 31 service specs with zero
    conflicts. Also found an undocumented remote MCP server and an undocumented
    GraphQL API.
