description: >-
  The entity graph of the Conga Advantage Platform, derived from the resource
  paths and nested sub-resource paths of Conga's own published OpenAPI documents.
  Relationships below are read off real path shapes (/parent/{id}/child) and real
  id-reference fields in request/response schemas - nothing is inferred from
  product marketing. Conga's model is a classic quote-to-cash core (Account ->
  Opportunity -> Quote -> Cart -> Order -> Asset -> Invoice) wrapped by a
  contract lifecycle (Contract -> Clause/Obligation/Review) and a document
  pipeline (Template -> Document -> Signature Package), all sitting on a
  metadata-driven object layer (Schema Manager) that lets customers define their
  own business objects.
id_convention:
  style: opaque string identifiers
  primary_field: Id (PascalCase) in platform/admin services, id (camelCase) in
    newer services
  external_id:
    field: ExternalId
    occurrences: 150
    note: >-
      The most common cross-reference field in the whole catalogue. Conga's
      upsert endpoints (users, user groups, products) key on an external
      identifier so a customer's system of record can drive the platform.
  prefixed_ids: false
  note: No typed id-prefix scheme (no "acct_"/"cus_" style prefixes) is published.
