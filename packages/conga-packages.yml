description: >-
  Conga publishes no REST client SDK for its 2,136-operation Advantage Platform
  REST API in any language - npm, PyPI, Maven Central, NuGet, RubyGems, crates.io
  and pkg.go.dev carry nothing first-party for it, and developer.conga.com
  documents raw HTTP calls only. The one genuinely first-party library Conga does
  ship is a TypeScript client for its GraphQL surface, published to npm under the
  @conga-cloud scope with author "Conga" and maintained by Conga-handled
  accounts. Conga also has no public GitHub organization (github.com/conga,
  /congacloud and /conga-inc all 404).
