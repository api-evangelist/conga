openapi: 3.2.0
info:
  title: Schema Manager Object Metadata API
  version: v1
servers:
- url: https://rls.congacloud.com
- url: https://preview-rls09.congacloud.com
security:
- bearerAuth: []
tags:
- name: Object Metadata
paths:
  /api/metadata/v1/objects:
    get:
      tags:
      - Object Metadata
      summary: Get all scoped object names
      description: Retrieves a list of object information, including object names and basic metadata, with support for sorting, pagination, and optional filtering.
      parameters:
      - name: sortField
        in: query
        description: Field name for sorting
        schema:
          type: string
      - name: sortDirection
        in: query
        description: Sort direction (ascending or descending) of the data in sortField.
        schema:
          $ref: '#/components/schemas/SortDirection'
      - name: pageSize
        in: query
        description: The number of records to display on each page
        schema:
          type: integer
          format: int32
      - name: pageNumber
        in: query
        description: The page number of the result set to view
        schema:
          type: integer
          format: int32
      - name: startsWithFilter
        in: query
        description: Optional filter to return objects that start with the specified string.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ObjectInfoListAPIResponse'
              example:
                Success: true
                Data:
                - Name: Currency
                  DisplayName: Currency
                  Description: Currency
                  Category: Platform
                  IsProtected: true
                  IsDeprecated: false
                  ObjectType: Default
                - Name: Role
                  DisplayName: Role
                  Description: Role
                  Category: Platform
                  IsProtected: true
                  IsDeprecated: false
                  ObjectType: Default
                - Name: ObjectPermission
                  DisplayName: ObjectPermission
                  Description: ObjectPermission
                  Category: Platform
                  IsProtected: true
                  IsDeprecated: false
                  ObjectType: Default
                - Name: Agreement_UserShare_p
                  DisplayName: Agreement_UserShare_p
                  Description: Agreement_UserShare_p
                  Category: Platform
                  IsProtected: true
                  IsDeprecated: false
                  ObjectType: Default
                StatusCode: OK
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectInfoListAPIResponse'
              example:
                Success: true
                Data:
                - Name: Currency
                  DisplayName: Currency
                  Description: Currency
                  Category: Platform
                  IsProtected: true
                  IsDeprecated: false
                  ObjectType: Default
                - Name: Role
                  DisplayName: Role
                  Description: Role
                  Category: Platform
                  IsProtected: true
                  IsDeprecated: false
                  ObjectType: Default
                - Name: ObjectPermission
                  DisplayName: ObjectPermission
                  Description: ObjectPermission
                  Category: Platform
                  IsProtected: true
                  IsDeprecated: false
                  ObjectType: Default
                - Name: Agreement_UserShare_p
                  DisplayName: Agreement_UserShare_p
                  Description: Agreement_UserShare_p
                  Category: Platform
                  IsProtected: true
                  IsDeprecated: false
                  ObjectType: Default
                StatusCode: OK
            text/json:
              schema:
                $ref: '#/components/schemas/ObjectInfoListAPIResponse'
              example:
                Success: true
                Data:
                - Name: Currency
                  DisplayName: Currency
                  Description: Currency
                  Category: Platform
                  IsProtected: true
                  IsDeprecated: false
                  ObjectType: Default
                - Name: Role
                  DisplayName: Role
                  Description: Role
                  Category: Platform
                  IsProtected: true
                  IsDeprecated: false
                  ObjectType: Default
                - Name: ObjectPermission
                  DisplayName: ObjectPermission
                  Description: ObjectPermission
                  Category: Platform
                  IsProtected: true
                  IsDeprecated: false
                  ObjectType: Default
                - Name: Agreement_UserShare_p
                  DisplayName: Agreement_UserShare_p
                  Description: Agreement_UserShare_p
                  Category: Platform
                  IsProtected: true
                  IsDeprecated: false
                  ObjectType: Default
                StatusCode: OK
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
  /api/metadata/v1/objects/customschema/export:
    post:
      tags:
      - Object Metadata
      summary: Export custom schema
      description: "For the object(s) passed in the request body, exports a schema (zipped, with a JSON file for each object) for custom fields and custom objects. This exports:\n            <ul><li>All of a custom object, except its default field.</li><li>All of a standard object, except its default and standard fields.</li></ul>"
      requestBody:
        description: 'A list of standard and custom objects. For example: ["Agreement","CustomObject1_c","CustomObject2_c"]'
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
          text/json:
            schema:
              type: array
              items:
                type: string
          application/*+json:
            schema:
              type: array
              items:
                type: string
      responses:
        '200':
          description: Success
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error
  /api/metadata/v1/objects/{objectName}:
