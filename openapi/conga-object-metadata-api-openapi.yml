  /api/metadata/v1/objects/{objectName}/dependencies:
    get:
      tags:
      - Object Metadata
      summary: Get all dependencies
      description: Retrieves all dependencies for a given object.
      parameters:
      - name: objectName
        in: path
        description: Name of the object
        required: true
