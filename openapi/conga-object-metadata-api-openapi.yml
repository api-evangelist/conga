          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependentObjectMetadataListAPIResponse'
              example:
                Success: true
                Data:
                - Name: Agreement
                  FieldName: ParentAgreement
                - Name: AgreementClause
                  FieldName: Agreement
                StatusCode: OK
        '400':
          description: Bad Request
        '500':
