          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: string
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: string
            text/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: string
components:
  securitySchemes:
    Bearer:
      type: apiKey
      description: Please insert JWT with Bearer into field
      name: Authorization
