        ReleaseUri:
          type:
          - string
          - 'null'
          description: Release URI to promote a package on target environment
        ClientId:
          type:
          - string
          - 'null'
          description: ClientId
        ClientSecret:
          type:
          - string
          - 'null'
          description: Client Secret
      additionalProperties: false
      description: Request to promote a package
    PackageDeploymentResponse:
      type: object
      properties:
        PackageName:
          type:
          - string
          - 'null'
          description: Name of the uploaded package
        DeploymentId:
          type:
          - string
          - 'null'
          description: Unique Id to track deployment status of the package/custom code project
      additionalProperties: false
      description: Custom code package deployment response
    PackageDeploymentResponseAPIResponse:
      type: object
      properties:
        Success:
          type: boolean
        RecordCount:
          type:
          - integer
          - 'null'
          format: int64
