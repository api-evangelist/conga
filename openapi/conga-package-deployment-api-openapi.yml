      type: object
      additionalProperties: false
    ResourceStatusInfoResponse:
      type: object
      properties:
        ResourceName:
          type:
          - string
          - 'null'
          description: Name of the custom code project
        ResourceType:
          type:
          - string
          - 'null'
          description: Type of the resource
        Status:
          $ref: '#/components/schemas/PackageDeploymentStatus'
      additionalProperties: false
      description: Resource information
    PackageInformationResponse:
      type: object
      properties:
        PackageName:
          type:
          - string
          - 'null'
          description: Name of the deployment package
        Description:
          type:
          - string
          - 'null'
          description: More information about the package
        ReleaseURI:
          type:
          - string
          - 'null'
          description: Release URI of the deployment package
        ReleaseLabel:
          type:
          - string
          - 'null'
          description: Release label of the deployment package
        Language:
          type:
          - string
          - 'null'
          description: Language used for the resources in this deployment package
        Status:
          type:
          - string
          - 'null'
          description: Status of the deployment package
        DeployedBy:
          type:
          - string
          - 'null'
          description: Information of the user who deployed this package
        DeployedOn:
          type: string
          description: Date and time when the package was created
          format: date-time
      additionalProperties: false
    PackageInformationResponseAPIResponse:
      type: object
      properties:
        Success:
          type: boolean
        RecordCount:
          type:
          - integer
          - 'null'
          format: int64
        Data:
          $ref: '#/components/schemas/PackageInformationResponse'
        Errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ErrorDetail'
        Profile:
          type:
          - string
          - 'null'
        TotalTime:
          type: number
          format: float
        StatusCode:
          $ref: '#/components/schemas/HttpStatusCode'
        HasMoreRecords:
          type:
          - boolean
          - 'null'
        NextCursor:
          type:
          - string
          - 'null'
        Warnings:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ErrorDetail'
      additionalProperties: false
    PackageDeploymentStatus:
      enum:
      - Queued
      - Inprogress
      - Succeeded
      - Failed
      - RollbackQueued
      - RollbackInprogress
      - RollbackSucceeded
      - RollbackFailed
      type: string
    ErrorDetail:
      type: object
      properties:
        Message:
          type:
          - string
          - 'null'
      additionalProperties: false
    BadRequestErrorResponseExampleAPIResponse:
      type: object
      properties:
        Success:
          type: boolean
        RecordCount:
          type:
          - integer
          - 'null'
          format: int64
        Data:
          $ref: '#/components/schemas/BadRequestErrorResponseExample'
        Errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ErrorDetail'
        Profile:
          type:
          - string
          - 'null'
        TotalTime:
          type: number
          format: float
        StatusCode:
          $ref: '#/components/schemas/HttpStatusCode'
        HasMoreRecords:
          type:
          - boolean
          - 'null'
        NextCursor:
          type:
          - string
          - 'null'
        Warnings:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ErrorDetail'
      additionalProperties: false
    PackageDeploymentStatusResponse:
      type: object
      properties:
        Name:
          type:
          - string
          - 'null'
          description: Package Name
        Status:
          $ref: '#/components/schemas/PackageDeploymentStatus'
        DeploymentId:
          type:
          - string
          - 'null'
          description: Deployment Id
        ProjectStatus:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ResourceStatusInfoResponse'
          description: List of Custom Code Project Status informations
