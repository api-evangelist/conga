      description: Custom code package deployment information
    PackageDeploymentHistoryResponse:
      type: object
      properties:
        Id:
          type:
          - string
          - 'null'
          description: A global unique identifier. **For example :** 1111ee11-1e11-11e11f11-1f1111c11e11
        PackageName:
          type:
          - string
          - 'null'
          description: Name of the deployment package
        DeploymentId:
          type:
          - string
          - 'null'
          description: Deployment Id for the package
        Status:
          type:
          - string
          - 'null'
