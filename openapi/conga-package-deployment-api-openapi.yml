    ResourcePackageDeploymentHistoryResponse:
      type: object
      properties:
        PackageName:
          type:
          - string
          - 'null'
          description: Name of the deployment package
        ResourceName:
          type:
          - string
          - 'null'
          description: Name of the custom code
        ResourceType:
          type:
          - string
          - 'null'
          description: Type of the custom code
        Status:
          type:
          - string
          - 'null'
          description: Status of the deployment package
        CreatedBy:
          type:
          - string
          - 'null'
          description: Information of the user who created this custom code
        CreatedDate:
          type: string
          description: Date and time when the custom code was created
          format: date-time
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
