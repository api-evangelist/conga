              LineItem:
                Id: 9f8edd3f-0696-411d-b532-dc560f1e1ebd
              LineNumber: 1
              LineType: Manual
              Type: Default
              Id: 1a99d836-641b-42db-ac78-c30f7737ef8a
            - AdjustmentType: Discount Amount
