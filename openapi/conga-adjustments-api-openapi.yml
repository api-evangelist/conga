openapi: 3.2.0
info:
  title: Cart - V1 Adjustments API
  version: v1
  description: Adjustments controller
servers:
- url: https://rls.congacloud.com
security:
- Bearer: []
tags:
- name: Adjustments
  description: Adjustments controller
paths:
  /api/cart/v1/carts/{cartId}/adjustments:
    delete:
      tags:
      - Adjustments
      summary: Delete cart adjustments
      description: 'Deletes one or more adjustments in a cart based on the cart ID in the

        endpoint request and the cart ID and adjustment IDs provided in the parameters.'
      parameters:
      - name: cartId
        in: path
        description: The cart's unique identifier
        required: true
        schema:
          type: string
      requestBody:
        description: The ID(s) of adjustment
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
            example:
            - adjustment-1
            - adjustment-2
          text/json:
            schema:
              type: array
              items:
                type: string
            example:
            - adjustment-1
            - adjustment-2
          application/*+json:
            schema:
              type: array
              items:
                type: string
            example:
            - adjustment-1
            - adjustment-2
      responses:
        '200':
          description: OK
        '202':
          description: Accepted
        '204':
          description: No Content
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
    get:
      tags:
      - Adjustments
      summary: Get cart adjustments
      description: Retrieves the adjustments for the cart (by cart ID).
      parameters:
      - name: cartId
        in: path
        description: The cart's unique identifier
        required: true
        schema:
          type: string
      - name: filter
        in: query
        description: Filter
        schema:
          type: array
          items:
            type: string
      - name: pageNumber
        in: query
        description: Page number
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: Page size
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
        '204':
          description: No Content
        '422':
          description: Unprocessable Content
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
        '500':
          description: Internal Server Error
    patch:
      tags:
      - Adjustments
      summary: Update adjustments by cart
      description: Updates one or more adjustment records for the given cartId.
      parameters:
      - name: cartId
        in: path
        description: The cart's unique identifier
        required: true
        schema:
          type: string
      requestBody:
        description: The adjustment line items
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Conga.Revenue.Entities.AdjustmentLineItem'
            example:
            - AdjustmentType: Discount Amount
              AdjustmentAmount: 15
              AdjustmentAppliesTo: Starting Price
              LineItem:
                Id: 9f8edd3f-0696-411d-b532-dc560f1e1ebd
              LineNumber: 1
              LineType: Manual
              Type: Default
              Id: 1a99d836-641b-42db-ac78-c30f7737ef8a
            - AdjustmentType: Discount Amount
              AdjustmentAmount: 15
              AdjustmentAppliesTo: Previous
              LineItem:
                Id: 9f8edd3f-0696-411d-b532-dc560f1e1ebd
              LineNumber: 0
              PricePoint: Net Price
              Id: 56689db9-11d8-4788-92e6-837cefce3815
              Name: Waterfall Manual Adj1
            - LineItem:
                Id: 9f8edd3f-0696-411d-b532-dc560f1e1ebd
              LineNumber: 0
              PricePoint: Net Price
              UnitAdjustment: 500
              Id: ced7eab6-fc69-4031-a372-861c74b4a9d7
              Name: AdjustmentOverride
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Conga.Revenue.Entities.AdjustmentLineItem'
            example:
            - AdjustmentType: Discount Amount
              AdjustmentAmount: 15
              AdjustmentAppliesTo: Starting Price
              LineItem:
                Id: 9f8edd3f-0696-411d-b532-dc560f1e1ebd
              LineNumber: 1
              LineType: Manual
              Type: Default
              Id: 1a99d836-641b-42db-ac78-c30f7737ef8a
