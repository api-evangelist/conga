        description: The cart's unique identifier
        required: true
        schema:
          type: string
      - name: lineItemId
        in: path
        description: lineItemId
        required: true
        schema:
          type: string
      requestBody:
        description: An adjustment's unique identifier
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
            example:
            - adjustment-1
            - adjustment-2
          text/json:
            schema:
              type: array
              items:
                type: string
            example:
            - adjustment-1
            - adjustment-2
          application/*+json:
            schema:
              type: array
              items:
                type: string
            example:
