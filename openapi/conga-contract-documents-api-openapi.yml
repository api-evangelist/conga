openapi: 3.2.0
info:
  title: Contracts Contract Documents API
  version: v1
servers:
- url: https://rls.congacloud.com
- url: https://preview-rls09.congacloud.com
security:
- bearerAuth: []
tags:
- name: Contract Documents
paths:
  /api/clm/v1/contracts/createoffline:
    post:
      tags:
      - Contract Documents
      summary: Create an offline contract document
      description: 'Creates a new contract record based on an imported third-party contract document and attaches the original document to the new contract.


        On success, the contract status changes to "Author Contract".'
      requestBody:
        description: File binary data
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                documentAttributes:
                  type: object
                  additionalProperties: {}
                contract:
                  type: object
                  additionalProperties: {}
            example:
              Name: Reviewer
              Description: Team is responsible to review the associated contract
              Action:
              - SendForReview
              IsActive: true
            encoding:
              file:
                style: form
              documentAttributes:
                style: form
              contract:
                style: form
      responses:
        '200':
          description: Returns the newly created contract document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentMetadataAPIResponse'
        '400':
          description: The provided contract data or file data is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseError'
              example:
                Success: false
                Data: null
                Warnings: null
                Errors:
                - Id: null
                  Message: Error Message
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseError'
              example:
                Success: false
                Data: null
                Warnings: null
                Errors:
                - Id: null
                  Message: Internal server error occurred. Please contact admin.
      operationId: postApiClmV1ContractsCreateoffline
      x-operation-id-source: derived
  /api/clm/v1/contracts/createoffline/large:
    post:
      tags:
      - Contract Documents
      summary: Creates an offline contract and imports a large document linked to it
      description: 'Creates a new contract record based on an imported third-party contract document and attaches the original document to the new contract.


        On success, the contract status changes to "Author Contract".'
      requestBody:
        description: "An object containing document-specific details, including the file name, file path of the large document and contract details required to create the contract.\n            to be imported."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractLargeDocumentRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ContractLargeDocumentRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ContractLargeDocumentRequest'
      responses:
        '200':
          description: Returns the newly created contract document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentMetadataAPIResponse'
        '400':
          description: The provided contract or file data is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseError'
              example:
                Success: false
                Data: null
                Warnings: null
                Errors:
                - Id: null
                  Message: Error Message
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseError'
              example:
                Success: false
                Data: null
                Warnings: null
                Errors:
                - Id: null
                  Message: Internal server error occurred. Please contact admin.
      operationId: postApiClmV1ContractsCreateofflineLarge
      x-operation-id-source: derived
  /api/clm/v1/contracts/storeexecuted:
    post:
      tags:
      - Contract Documents
      summary: Create a contract from an executed contract
      description: 'Creates a new contract record from the provided executed contract document.


        On success, the contract status changes to "Activated".'
      requestBody:
        description: File binary data
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                documentAttributes:
                  type: object
                  additionalProperties: {}
                contract:
                  type: object
                  additionalProperties: {}
            example:
              Name: Reviewer
              Description: Team is responsible to review the associated contract
              Action:
              - SendForReview
              IsActive: true
            encoding:
              file:
                style: form
              documentAttributes:
                style: form
              contract:
                style: form
      responses:
        '200':
          description: Returns contract document details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentMetadataAPIResponse'
        '400':
          description: The provided contract data or file data is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseError'
              example:
                Success: false
                Data: null
                Warnings: null
                Errors:
                - Id: null
                  Message: Error Message
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseError'
              example:
                Success: false
                Data: null
                Warnings: null
                Errors:
                - Id: null
                  Message: Internal server error occurred. Please contact admin.
      operationId: postApiClmV1ContractsStoreexecuted
      x-operation-id-source: derived
  /api/clm/v1/contracts/storeexecuted/large:
    post:
      tags:
      - Contract Documents
      summary: Store an executed large document
      description: 'Stores an executed large document for the specified contract ID. This operation allows the user to upload or reference

        a document that is already uploaded to a filestore, and it links the document to the contract.'
      requestBody:
        description: "An object containing document-specific details, including the file name and file path of the large document \n            to be stored."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractLargeDocumentRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ContractLargeDocumentRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ContractLargeDocumentRequest'
      responses:
        '200':
          description: Returns the newly created contract document.
          content:
            application/json:
              schema:
