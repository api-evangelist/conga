  /api/clm/v1/contracts/{contractId}/importoffline/large:
    post:
      tags:
      - Contract Documents
      summary: Import a large document
      description: 'Imports a large document for the specified contract ID. This operation allows the user to upload or reference

        a document that is already uploaded to a filestore, and it links the document to the contract.'
      parameters:
      - name: contractId
        in: path
        description: ID of the contract
        required: true
        schema:
          type: string
      requestBody:
        description: "An object containing document-specific details, including the file name and file path of the large document \n            to be imported."
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LargeDocumentRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/LargeDocumentRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/LargeDocumentRequest'
      responses:
        '200':
          description: Returns the newly created contract document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentMetadataAPIResponse'
        '400':
          description: The provided contract ID or file data is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseError'
              example:
                Success: false
                Data: null
                Warnings: null
                Errors:
                - Id: null
                  Message: Error Message
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseError'
              example:
                Success: false
                Data: null
                Warnings: null
                Errors:
                - Id: null
                  Message: Internal server error occurred. Please contact admin.
      operationId: postApiClmV1ContractsByContractIdImportofflineLarge
      x-operation-id-source: derived
