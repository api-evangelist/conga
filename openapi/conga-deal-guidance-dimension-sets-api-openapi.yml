      summary: Update deal guidance dimension sets
      description: Updates the list of the dimension sets for a pricing deal.
      requestBody:
        description: The list of Deal Guidance Dimension Sets with updated data
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                additionalProperties: {}
