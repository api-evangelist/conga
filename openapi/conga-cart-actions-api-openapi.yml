      operationId: getApiCartV1CartsByCartIdGroupStatus
      x-operation-id-source: derived
  /api/cart/v1/carts/{cartId}/line-numbers:
    get:
      tags:
      - Cart Actions
      summary: Get cart line numbers
      description: Fetches and validates the line numbers for a given cart ID.
      parameters:
      - name: cartId
        in: path
        description: The unique identifier of the cart
        required: true
        schema:
          type: string
      - name: filter
        in: query
        description: Add conditional filters in standard URI format to narrow the search result.
        schema:
          type: array
          items:
            type: string
      - name: filterExpression
        in: query
        description: FilterExpression to filter using AND/OR e.g. "(1 AND (2 OR 3)). If this parameter is null, it will apply AND by default among all filter conditions."
        schema:
          type: string
      - name: sort
        in: query
        description: Add conditional sorting in standard URI format to order the results.
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
        '422':
