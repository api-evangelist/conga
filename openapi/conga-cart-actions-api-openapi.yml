          type: string
      - name: group
        in: query
        description: Group Name
        required: true
        schema:
          type: string
      - name: filter
        in: query
        description: Filter Conditions
        schema:
          type: array
          items:
            type: string
      - name: sort
        in: query
        schema:
          type: array
          items:
            type: string
      - name: isMetadata
        in: query
        description: Flag indicating if metadata is requested
        schema:
          type: boolean
          default: false
      - name: pageNumber
        in: query
        description: Page number
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: Page size
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
        '500':
