  /api/cart/v1/carts/{cartId}/migrate:
    post:
      tags:
      - Cart Actions
      summary: Migrate a cart
      description: 'Migrates a cart associated with the cart ID provided in the parameters.

        A cart with Abandoned or Superseded status cannot be migrated.'
      parameters:
      - name: cartId
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: FlowName
        in: header
