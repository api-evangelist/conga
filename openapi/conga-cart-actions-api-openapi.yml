        schema:
          type: string
      - name: actionParameters
        in: query
        description: Action parameters
        schema:
          type: object
          additionalProperties: {}
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
        '500':
          description: Internal Server Error
      operationId: getApiCartV1CartsByCartIdDisplayAction
      x-operation-id-source: derived
  /api/cart/v1/carts/{cartId}/finalize:
    get:
      tags:
      - Cart Actions
      summary: Get finalized cart details
      description: Validates and retrieves the finalized cart details for a given cart.
      parameters:
      - name: cartId
        in: path
        description: The unique identifier of the cart
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '500':
          description: Internal Server Error
      operationId: getApiCartV1CartsByCartIdFinalize
      x-operation-id-source: derived
    post:
      tags:
      - Cart Actions
      summary: Finalize a cart
      description: 'Finalizes the cart, completing product configuration. This API finalizes the cart when the final set of products and prices is confirmed. This API also validates the following during runtime:

        * Whether any product is missing the required configuration. If so, it displays an error message.

        * Whether any product requires repricing. If so, it displays an error message.

        * Up to two levels of inclusion and exclusion constraint rules for a product, bundle, sub-bundle, and options belonging to a product family or product group.

        * Inclusion and exclusion constraint rules across bundles.'
      parameters:
      - name: cartId
        in: path
        description: The unique identifier of the cart
        required: true
        schema:
          type: string
      requestBody:
        description: The finalize cart model
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Conga.Revenue.Cart.Manager.Model.FinalizeCartModel'
          text/json:
            schema:
              $ref: '#/components/schemas/Conga.Revenue.Cart.Manager.Model.FinalizeCartModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Conga.Revenue.Cart.Manager.Model.FinalizeCartModel'
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
      operationId: postApiCartV1CartsByCartIdFinalize
      x-operation-id-source: derived
  /api/cart/v1/carts/{cartId}/group/status:
    get:
      tags:
      - Cart Actions
      summary: Gets the line items group metadata
      parameters:
