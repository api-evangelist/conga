            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
      operationId: postApiCartV1CartsByCartIdMigrate
      x-operation-id-source: derived
  /api/cart/v1/carts/{cartId}/order:
    post:
      tags:
      - Cart Actions
      summary: Check the cart out
      description: 'Checks out the cart to create an order and order line items based on the given cart ID. The cart does not have to be in Finalized status to check out and create an order: it can be checked out to create an order even from the Draft status. This API returns the created order object with all the order line items. After order creation, the created order is in Draft status, and the cart’s status is Finalized. You can pass the following information for addition to the newly generated order.

        * OrderAsync Name

        * Accounts

        * Sold To

        * Ship To

        * Bill To

        * Primary Contact

        * Comments (if any)'
      parameters:
      - name: cartId
        in: path
        description: The unique identifier of the cart
        required: true
        schema:
          type: string
      - name: includes
        in: query
        description: Enter the term included in the cart details to narrow down the serach results.
        schema:
          type: array
          items:
            type: string
      - name: isFromObjectDB
        in: query
        description: Set the isFromObjectDB to True to check out from the object database. By default, this value is set to False.
        schema:
          type: boolean
          default: false
      - name: hasAcceptedWarning
        in: query
        description: if set to `true` [has accepted warning].
        schema:
          type: boolean
          default: true
      - name: isAsync
        in: query
        description: if set to `true` [is asynchronous].
        schema:
          type: boolean
          default: false
      requestBody:
        description: The order override
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          text/json:
            schema:
              type: object
              additionalProperties: {}
          application/*+json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        '200':
          description: OK
        '202':
          description: Accepted
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
      operationId: postApiCartV1CartsByCartIdOrder
      x-operation-id-source: derived
  /api/cart/v1/carts/{cartId}/promotion:
    post:
      tags:
      - Cart Actions
      summary: Apply promotion to the cart
      description: Validates and applies a promotion to the given cart.
      parameters:
      - name: cartId
        in: path
        description: The unique identifier of the cart
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      operationId: postApiCartV1CartsByCartIdPromotion
      x-operation-id-source: derived
  /api/cart/v1/carts/{cartId}/quote:
    post:
      tags:
      - Cart Actions
      summary: Check the cart out to create a quote
      description: 'Checks out the finalized cart to create a new quote/proposal. This API validates the following during runtime.

        * The API finalizes the cart, validating all required configurations. If any condition is not met, the cart is not finalized, and the quote/proposal is not created.

        * When there are no cart finalization errors, a new quote/proposal is created and associated with the cart ID passed in the parameters.

        The API passes the cart line items to the quote line items. To run this API, at least one product must be added to the cart. After the quote is created, the quote is in draft status, and the cart is in finalized status.

        The following information is created for the new quote.

        * RFP due date

        * Accounts

        * Sold To

        * Ship To

        * Bill To

        * Primary Contact

        * Comments (if any)

        You can also create multiple quotes by passing the same cart ID.'
      parameters:
      - name: cartId
        in: path
        description: The unique identifier of the cart
        required: true
        schema:
          type: string
      - name: includes
        in: query
        description: Optional list of objects (line-items, adjustments, price-breakups, usage-tiers, summary-groups, product, pricelist, option, pricelistitem, line-items.option, line-items.product, line-items.pricelist, line-items.pricelistitem) to be included in the response. Each object type must be specified in the query string separately.
        schema:
          type: array
          items:
            type: string
      - name: hasAcceptedWarning
        in: query
        schema:
          type: boolean
          default: true
      requestBody:
        description: The quote override
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Conga.Revenue.Entities.Models.QuoteOverride'
          text/json:
            schema:
              $ref: '#/components/schemas/Conga.Revenue.Entities.Models.QuoteOverride'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Conga.Revenue.Entities.Models.QuoteOverride'
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
      operationId: postApiCartV1CartsByCartIdQuote
      x-operation-id-source: derived
  /api/cart/v1/carts/{cartId}/revalidation:
    get:
      tags:
      - Cart Actions
      summary: Get revalidation details
      description: Retrieves revalidation details for a given cart.
      parameters:
      - name: cartId
        in: path
        description: The unique identifier of the cart
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
        '500':
          description: Internal Server Error
      operationId: getApiCartV1CartsByCartIdRevalidation
      x-operation-id-source: derived
    post:
      tags:
      - Cart Actions
      summary: Apply revalidation
      description: Validates and applies the revalidation to a given cart.
      parameters:
      - name: cartId
        in: path
        description: The unique identifier of the cart
        required: true
        schema:
          type: string
      requestBody:
