openapi: 3.2.0
info:
  title: Cart - V1 Cart Actions API
  version: v1
  description: The cart actions controller
servers:
- url: https://rls.congacloud.com
security:
- Bearer: []
tags:
- name: Cart Actions
  description: The cart actions controller
paths:
  /api/cart/v1/carts/active:
    get:
      tags:
      - Cart Actions
      summary: Get the latest active cart
      description: 'Gets the latest active cart, filtering carts with New and Saved status by default.

        Pass the quote ID in the parameters. If the cart for the provided quote does not exist, this API creates a new cart. For an existing cart, the saved cart ID is returned.

        For a newly created cart, the cart status is "New" and a new cart ID is generated.

        The following fields are passed from the quote header to the newly created cart: Account, Price List, Status, Business Object, Business Object Type, Cart Effective Date, Expected Start Date, Expected End Date, Location, Quote/Proposal, Pricing Date, Payment Term, and Cart Name.'
      parameters:
      - name: filter
        in: query
        description: Add optional conditional filters in standard URI format to narrow the search result.
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
      operationId: getApiCartV1CartsActive
      x-operation-id-source: derived
  /api/cart/v1/carts/{cartId}/abandon:
    post:
      tags:
      - Cart Actions
      summary: Abandon a cart
      description: Validates and abandons a cart.
      parameters:
      - name: cartId
        in: path
        description: The unique identifier of the cart
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
        '409':
          description: Conflict
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
      operationId: postApiCartV1CartsByCartIdAbandon
      x-operation-id-source: derived
  /api/cart/v1/carts/{cartId}/activate:
    post:
      tags:
      - Cart Actions
      summary: Activate a cart
      description: 'Activates a cart associated with the cart ID provided in the parameters.

        Only a cart with a New and Saved status can be activated. Carts in such other statuses as Finalized, Superseded, Suspended, Abandoned, or Deleted cannot be activated.'
      parameters:
      - name: cartId
        in: path
        description: The cart's unique identifier
        required: true
        schema:
          type: string
      - name: FlowName
        in: header
        description: Header param FlowName
        schema:
          type: string
          default: system
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
      operationId: postApiCartV1CartsByCartIdActivate
      x-operation-id-source: derived
  /api/cart/v1/carts/{cartId}/applied-rule-actions:
    get:
      tags:
      - Cart Actions
      summary: Get the applied rule actions
      description: Retrieves the applied rule action for a given cart ID and primary line number.
      parameters:
      - name: cartId
        in: path
        description: The cart identifier
        required: true
        schema:
          type: string
      - name: primarylineNumber
        in: query
        description: Primary Line number of the product
        schema:
          type: integer
          format: int32
      - name: pagenumber
        in: query
        description: Enter the page number of the line.
        schema:
          type: integer
          format: int32
          default: 1
      - name: pagesize
        in: query
        description: Enter the number of objects to be retrieved.
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
        '500':
          description: Internal Server Error
      operationId: getApiCartV1CartsByCartIdAppliedRuleActions
      x-operation-id-source: derived
  /api/cart/v1/carts/{cartId}/clone:
    post:
      tags:
      - Cart Actions
      summary: Clone a cart
      description: 'Clones a cart according to the primary lines no. given by the user or else clones the cart creating an exact copy of the entire cart with all its contents. The cloned cart is created in the new status. The cartID parameter is required. Set the price query parameter to true to price the cart.

        Clones a cart creating an exact copy of the entire cart with all its contents. The cloned cart is created in the new status. The cartID parameter is required. Set the price query parameter to true to price the cart.

        For Price true clones a cart according to the line no. given by the user but if nothing is given then clones the whole cart creating an exact copy of the entire cart with all its contents.'
      parameters:
      - name: cartId
        in: path
        description: The cart identifier
        required: true
        schema:
          type: string
      - name: price
        in: query
        description: 'A price query parameter that controls how pricing is handled during the clone operation. If the price parameter is not provided or set to the default value `false`, the API performs a clone without running pricing logic. This behavior is supported only for carts with `cart usetype ` set to `shadow`, which are temporary, non-persistent carts used internally by the Digital Commerce. If set to `true`, the API clones the cart with pricing enabled. This is the preferred option for regular (non-shadow) carts. The pricing logic runs during cloning, and the cloned cart is saved and processed normally. At present, the price: `false` option is limited to shadow cart scenarios only.'
        schema:
          type: boolean
          default: false
      - name: isChildObjectToClone
        in: query
        description: The is child object to clone
        schema:
          type: boolean
          default: false
      - name: includes
        in: query
        description: The includes
        schema:
          type: array
          items:
            type: string
      - name: cloneLineItems
        in: query
        description: Flag to clone line items
        schema:
          type: boolean
          default: true
      - name: retainApproval
        in: query
        description: Indicate do we need to retain approval status from main cart to clone cart
        schema:
          type: boolean
          default: false
      requestBody:
        description: The cart fields to copy
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Conga.Revenue.Cart.Manager.Model.CloneFieldsToOverrideModel'
          text/json:
            schema:
              $ref: '#/components/schemas/Conga.Revenue.Cart.Manager.Model.CloneFieldsToOverrideModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Conga.Revenue.Cart.Manager.Model.CloneFieldsToOverrideModel'
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
      operationId: postApiCartV1CartsByCartIdClone
      x-operation-id-source: derived
  /api/cart/v1/carts/{cartId}/clone-lines:
    post:
      tags:
      - Cart Actions
      summary: Clone lines into existing cart
      parameters:
      - name: cartId
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: sourceCartId
        in: query
        description: ''
        schema:
          type: string
      requestBody:
        description: ExcludeAdjustment default value is false. ExcludeUsagePriceTier default value is false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Conga.Revenue.Cart.Manager.Model.CloneLinesModel'
          text/json:
            schema:
              $ref: '#/components/schemas/Conga.Revenue.Cart.Manager.Model.CloneLinesModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Conga.Revenue.Cart.Manager.Model.CloneLinesModel'
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
      operationId: postApiCartV1CartsByCartIdCloneLines
      x-operation-id-source: derived
  /api/cart/v1/carts/{cartId}/configstatus:
    get:
      tags:
      - Cart Actions
      summary: Retrieve Configuration status
      description: 'Returns config status of the cart associated with a given cart ID.

        **Note**: Use either primaryLineNumbers or lineNumbers to filter your API responses.

        If you specify both, the API fetches results according to the primaryLineNumbers parameter.'
      parameters:
      - name: cartId
        in: path
        description: The unique identifier of the cart
        required: true
        schema:
          type: string
      - name: primaryLineNumbers
        in: query
        description: "Specify the primary line numbers to be returned in the response.\n            Otherwise, the API returns last added/updated lineitems. See below to specify multiple primary line numbers.\n            GET  ../api/cart/v1/carts/{cartId}/configstatus?primaryLineNumbers=1,2,3"
        schema:
          type: array
          items:
            type: integer
            format: int32
      - name: lineNumbers
        in: query
        description: "Specify the line numbers to be returned in the response.\n            Otherwise, the API returns last added/updated lineitems. See below to specify multiple line numbers.\n            GET  ../api/cart/v1/carts/{cartId}/configstatus?lineNumbers=1,2,3"
        schema:
          type: array
          items:
            type: integer
            format: int32
      - name: filter
        in: query
        description: Add conditional filters in standard URI format to narrow the search result.
        schema:
          type: array
          items:
            type: string
      - name: includes
        in: query
        description: 'A list of related objects to include in search results. Related objects for inclusion can be: line-items'
        schema:
          type: array
          items:
            type: string
      - name: pageNumber
        in: query
        description: Enter the page number of the line. For example, if there are 500 lines in the cart and page size is 25, then a page number can vary from 1 to 20.
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: Enter the number of objects to be retrieved.
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: OK
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
        '500':
          description: Internal Server Error
      operationId: getApiCartV1CartsByCartIdConfigstatus
      x-operation-id-source: derived
  /api/cart/v1/carts/{cartId}/displayAction:
    get:
      tags:
      - Cart Actions
      summary: Retrive display action details
      description: Fetches all display action details for the specified cart in the given flow.
      parameters:
