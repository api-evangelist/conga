        - Base Price
        AdjustmentAppliesTo: Previous
        WaterfallRuleset:
          Id: WaterFallRuleSet-Id
          Name: WaterFallRuleSet-Name
        RuleType: Dimension
        Dimension1:
          Id: Dimension1-Id
          Name: Dimension1-Name
    LookupObject:
      type: object
      properties:
        Id:
          type:
          - string
          - 'null'
        Name:
          type:
          - string
          - 'null'
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: apiKey
      description: Please insert JWT with Bearer into field
      name: Authorization
      in: header
