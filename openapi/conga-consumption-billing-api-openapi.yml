  /usage-inputs/estimate:
    post:
      tags:
      - Consumption Billing
      summary: Estimates draft ratings for the specified usage input records without updating their final status.
      description: "The usage inputs can be processed in two modes: \n\nAsynchronous mode: If UsageInputRatingRequest.ProcessAllUsageInputs is `true`, all loaded usage input records will be estimated asynchronously. \n\nThe response will include a `JobId` to track the background operation. \n\nSynchronous mode: If UsageInputRatingRequest.ProcessAllUsageInputs is `false`, only the records with IDs provided in UsageInputRatingRequest.UsageInputIds will be estimated synchronously. \n\nThe response will include the batch results for the specified records. \n\n\nAutomatic async fallback: If `UsageInputRatingRequest.ProcessAllUsageInputs` is `false` but the number of values in \n`UsageInputRatingRequest.UsageInputIds` exceeds the configured threshold, the request will be processed \nasynchronously regardless of mode selection, and the response will include a `JobId`. \n\n\nThis design allows the client to control:\n\n- Whether the operation applies to all records or only a specific subset.\n\n- Whether the operation is performed synchronously or asynchronously, subject to system thresholds."
      requestBody:
        description: The request specifying which usage input records to estimate and how to process them.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageInputRatingRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UsageInputRatingRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UsageInputRatingRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'
        '207':
          description: Multi-Status
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'
        '500':
          description: Internal Server Error
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
  /usage-inputs/rate:
    post:
      tags:
      - Consumption Billing
      summary: Rates the specified usage input records.
      description: "The usage inputs can be processed in two modes: \n\nAsynchronous mode: If UsageInputRatingRequest.ProcessAllUsageInputs is `true`, all usage input records with status as Loaded will be rated asynchronously. \n\nThe response will include a `JobId` to track the background operation. \n\nSynchronous mode: If UsageInputRatingRequest.ProcessAllUsageInputs is `false`, only the records with IDs provided in UsageInputRatingRequest.UsageInputIds will be rated synchronously. \n\nThe response will include the batch results for the specified records. \n\n\nThis design allows the client to control:\n\n- Whether the operation applies to all records or only a specific subset.\n\n- Whether the operation is performed synchronously or asynchronously."
      requestBody:
        description: The request specifying which usage input records to rate and how to process them.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageInputRatingRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UsageInputRatingRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UsageInputRatingRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'
        '207':
          description: Multi-Status
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/BatchOperationResponse'
            text/json:
              schema:
