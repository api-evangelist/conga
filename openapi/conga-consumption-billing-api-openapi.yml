              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
  /usage-inputs/unrate:
    post:
      tags:
      - Consumption Billing
      summary: Reverses ratings for the specified usage input records.
      description: 'Reverses ratings for the specified usage input records.


        '
      requestBody:
        description: The request specifying which usage input records should be unrated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageInputBaseRequest'
          text/json:
            schema:
