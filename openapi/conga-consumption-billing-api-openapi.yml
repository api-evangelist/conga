openapi: 3.2.0
info:
  title: Billing Management Consumption Billing API
  version: 1.0.0
  description: 'Controller for CRUD operations on usage inputs, supporting rating, unrating,

    and draft rating in synchronous and asynchronous modes.'
servers:
- url: https://rls.congacloud.com/api/billing/v1
security:
- Bearer: []
tags:
- name: Consumption Billing
  description: 'Controller for CRUD operations on usage inputs, supporting rating, unrating,

    and draft rating in synchronous and asynchronous modes.'
