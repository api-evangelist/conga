            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
  /usage-inputs/{usageInputId}:
    get:
      tags:
      - Consumption Billing
      summary: Get a usage input record
      description: Retrieves a single usage input record by its identifier.
      parameters:
      - name: usageInputId
        in: path
        description: The identifier of the usage input
        required: true
        schema:
          type: string
      - name: includes
        in: query
        description: Optional related entities to include
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UsageInputs'
            application/json:
              schema:
                $ref: '#/components/schemas/UsageInputs'
            text/json:
              schema:
