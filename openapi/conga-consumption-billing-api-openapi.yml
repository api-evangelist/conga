        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
components:
  schemas:
    CurrencyField:
      type: object
      properties:
        Value:
          type: number
          format: double
        DisplayValue:
          type: number
          format: double
          readOnly: true
        CurrencyCode:
          type:
          - string
          - 'null'
          readOnly: true
        CurrencySymbol:
          type:
          - string
          - 'null'
          readOnly: true
      additionalProperties: false
    UsageInputsRequest:
      type: object
      properties:
        Id:
          type:
          - string
          - 'null'
          description: The unique identifier of the usage input record.
        Type:
          type:
          - string
          - 'null'
          description: Indicates whether the input is a regular entry vs. an overage entry.
        PeriodStartDate:
          type:
          - string
          - 'null'
          description: The start date of the usage in a usage period.
          format: date-time
        PeriodEndDate:
          type:
          - string
          - 'null'
          description: The end date of the usage in a usage period.
          format: date-time
        SubmissionDate:
          type:
          - string
          - 'null'
          description: The ‘date’ by which the usage is accumulated within a period for tracking/forecast/rating purposes.
          format: date-time
        SubscriptionIdentifierObject:
          type:
          - string
          - 'null'
          description: The identifier to reference a subscription.
        SubscriptionIdentifierField:
          type:
          - string
          - 'null'
          description: Indicates the unique field to identify the subscription record (E.g., AssetNumber).
        SubscriptionIdentifierValue:
          type:
          - string
          - 'null'
          description: The record ID of the subscription identifier chosen.
        UnitofMeasure:
          type:
          - string
          - 'null'
          description: Indicates the unit of measure (UOM) of the quantity.
        Quantity:
          type:
          - number
          - 'null'
          description: The quantity to be rated for this usage input record.
          format: double
        DraftQuantity:
          type:
          - number
          - 'null'
          description: The ‘expected’ quantity for this usage input record.
          format: double
        RatingStatus:
          type:
          - string
          - 'null'
          description: Indicates the status of the rating process.
      additionalProperties: false
      description: Represents a request to create or update usage input records
    UsageInputRatingRequest:
      type: object
      properties:
        UsageInputIds:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Gets or sets the identifiers of usage input records to process.
        ProcessAllUsageInputs:
          type: boolean
          description: Gets or sets a value indicating whether all usage input records should be processed.
      additionalProperties: false
      description: Represents a request to rate, unrate, or estimate usage input records.
    ErrorApiResponse:
      type: object
      properties:
        Errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ApiError'
      additionalProperties: false
    ApiError:
      type: object
      properties:
        Source:
          type:
          - string
          - 'null'
        Title:
          type:
          - string
          - 'null'
        Detail: {}
        Help:
          type:
          - string
          - 'null'
      additionalProperties: false
    BaseResponse:
      type: object
      properties:
        Id:
          type:
          - string
          - 'null'
        RecordIndex:
          type: integer
          format: int32
        IsSuccess:
          type: boolean
        Errors:
          type:
          - array
          - 'null'
          items:
            type: string
        ErrorMessage:
          type:
          - string
          - 'null'
          deprecated: true
      additionalProperties: false
    BatchOperationResponse:
      type: object
      properties:
        JobId:
          type:
          - string
          - 'null'
        BatchResults:
          $ref: '#/components/schemas/BaseResponseBatchResponse'
        IsSuccess:
          type:
          - boolean
          - 'null'
        Errors:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    UsageInputs:
      type: object
      properties:
        Id:
          type:
          - string
          - 'null'
        Name:
          type:
          - string
          - 'null'
        CreatedBy:
          $ref: '#/components/schemas/LookupObject'
        CreatedDate:
          type: string
          format: date-time
        ModifiedBy:
          $ref: '#/components/schemas/LookupObject'
        ModifiedDate:
          type: string
          format: date-time
        ExternalId:
          type:
          - string
          - 'null'
        ETag:
          type:
          - string
          - 'null'
        Type:
          type:
          - string
          - 'null'
        PeriodStartDate:
          type:
          - string
          - 'null'
          format: date-time
        PeriodEndDate:
          type:
          - string
          - 'null'
          format: date-time
        SubmissionDate:
          type:
          - string
          - 'null'
          format: date-time
        SubscriptionIdentifierObject:
          type:
          - string
          - 'null'
        SubscriptionIdentifierField:
          type:
          - string
          - 'null'
        SubscriptionIdentifierValue:
          type:
          - string
          - 'null'
        SubscriptionIdentifierRecordID:
          type:
          - string
          - 'null'
        UnitofMeasure:
          type:
          - string
          - 'null'
        Quantity:
          type:
          - number
          - 'null'
          format: double
        RatedAmount:
          $ref: '#/components/schemas/CurrencyField'
        DraftQuantity:
          type:
          - number
          - 'null'
          format: double
        DraftRatedAmount:
          $ref: '#/components/schemas/CurrencyField'
        RatingStatus:
          type:
          - string
          - 'null'
        BillingScheduleRecord:
          $ref: '#/components/schemas/LookupObject'
        UsageInputNumber:
          type:
          - string
          - 'null'
        BillingHeader:
          $ref: '#/components/schemas/LookupObject'
        Currency:
          type:
          - string
          - 'null'
        RatingMessage:
          type:
          - string
          - 'null'
      additionalProperties: {}
    BaseResponseBatchResponse:
      type: object
      properties:
        Summary:
          type:
          - string
          - 'null'
        Results:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BaseResponse'
