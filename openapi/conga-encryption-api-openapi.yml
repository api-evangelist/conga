openapi: 3.2.0
info:
  title: X-Author Encryption API
  version: v1
  description: Encryption controller which will be used to create all the methods for encrypt/decrypt.
servers:
- url: https://xauthor-prod-rls10.congacloud.com
- url: https://xauthor-preview-rls09.congacloud.com
security:
- bearerAuth: []
tags:
- name: Encryption
  description: Encryption controller which will be used to create all the methods for encrypt/decrypt.
paths:
  /api/xauthor/v1/encryption/encrypt:
    post:
      tags:
      - Encryption
      summary: Encrypt provided text
      parameters:
      - name: text
        in: query
        description: text
        schema:
          type:
          - string
          - 'null'
          description: text
      - name: OrgType
        in: header
        required: true
        schema:
          type: string
          default: RLP
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '500':
          description: Server Error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
