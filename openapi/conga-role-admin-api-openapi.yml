          description: The role's name
        Description:
          type:
          - string
          - 'null'
          description: The role's description
      additionalProperties: false
    DeleteAdminPermissions:
      type: object
      properties:
        AdminPermissionNames:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    RoleAPIResponse:
      type: object
      properties:
        Success:
          type: boolean
        RecordCount:
          type:
          - integer
          - 'null'
          format: int64
        Data:
          $ref: '#/components/schemas/Role'
        Errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ErrorDetail'
        Profile:
          type:
          - string
          - 'null'
