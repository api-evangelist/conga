      properties:
        Field:
          $ref: '#/components/schemas/ComplexFieldMetadataEntryUpdateModel'
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
