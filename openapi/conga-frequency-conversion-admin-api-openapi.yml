              example:
                Success: false
                Errors:
                - Message: Internal server error occurred. Please contact admin.
                StatusCode: OK
    put:
      tags:
      - Frequency Conversion Admin
      summary: Update a frequency conversion rate
      description: Updates a frequency conversion rate for the given frequency conversion rate ID.
      parameters:
      - name: id
        in: path
        description: Frequency conversion rate ID
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        description: Frequency conversion rate information
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          text/json:
