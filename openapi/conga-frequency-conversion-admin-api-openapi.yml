openapi: 3.2.0
info:
  title: Conversion Management Frequency Conversion Admin API
  version: v1
servers:
- url: https://rls.congacloud.com
- url: https://preview-rls09.congacloud.com
security:
- bearerAuth: []
tags:
- name: Frequency Conversion Admin
paths:
  /api/conversion-management/v1/frequency-conversion-rates:
    get:
      tags:
      - Frequency Conversion Admin
      summary: Get all frequency conversion rates
      description: Returns all frequency conversion rates that meet the criteria.
      parameters:
      - name: criteria
        in: query
        description: 'Search criteria for the frequency conversion rates. **For example**: FromFrequency = ''Daily''. <p>**Note**: The criteria field (in this case, FromFrequency) should be indexed.</p>'
        style: form
        schema:
          type: string
      - name: sortField
        in: query
        description: 'Field name for sorting. **For example**: ModifiedDate. <p>**Note**: The sort field (in this case, ModifiedDate) should be indexed or sortable.</p>'
        style: form
        schema:
          type: string
      - name: sortDirection
        in: query
        description: 'Sort direction (Ascending or Descending) of the data. For example: ASC or DESC. <p>**Note**: The default sort order is **DESC** if the sort field parameter is specified.</p>'
        style: form
        schema:
          type: string
      - name: pageSize
        in: query
        description: The number of records to display on each page.
        style: form
        schema:
          type: integer
          format: int32
      - name: pageNumber
        in: query
        description: The page number of the result set to view.
        style: form
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrequencyConversionRateListAPIResponse'
              example:
                Success: true
                RecordCount: 2
                Data:
                - FromFrequency: Weekly
                  ToFrequency: Daily
                  Product: null
                  ProductFamily: null
                  ConversionRate: 7
                  Id: null
                  Name: null
                  CreatedBy: null
                  CreatedDate: '0001-01-01T00:00:00'
                  ModifiedBy: null
                  ModifiedDate: '0001-01-01T00:00:00'
                  ExternalId: null
                  ETag: null
                - FromFrequency: Daily
                  ToFrequency: Hourly
                  Product: null
                  ProductFamily: null
                  ConversionRate: 24
                  Id: null
                  Name: null
                  CreatedBy: null
                  CreatedDate: '0001-01-01T00:00:00'
                  ModifiedBy: null
                  ModifiedDate: '0001-01-01T00:00:00'
                  ExternalId: null
                  ETag: null
                StatusCode: OK
        '400':
          description: Found unknown field(s)
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringAPIResponse'
              example:
                Success: false
                Errors:
                - Message: Internal server error occurred. Please contact admin.
                StatusCode: OK
    post:
      tags:
      - Frequency Conversion Admin
      summary: Add a new frequency conversion rate
      description: Creates a new frequency conversion rate.
      requestBody:
        description: Frequency conversion rate information
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FrequencyConversionRate'
          text/json:
            schema:
              $ref: '#/components/schemas/FrequencyConversionRate'
          application/*+json:
            schema:
              $ref: '#/components/schemas/FrequencyConversionRate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrequencyConversionRateAPIResponse'
              example:
                Success: true
                Data:
                  FromFrequency: Weekly
                  ToFrequency: Daily
                  Product: null
                  ProductFamily: null
                  ConversionRate: 7
                  Id: null
                  Name: null
                  CreatedBy: null
                  CreatedDate: '0001-01-01T00:00:00'
                  ModifiedBy: null
                  ModifiedDate: '0001-01-01T00:00:00'
                  ExternalId: null
                  ETag: null
                StatusCode: OK
        '400':
          description: Found unknown field(s)
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringAPIResponse'
              example:
                Success: false
                Errors:
                - Message: Internal server error occurred. Please contact admin.
                StatusCode: OK
