      parameters:
      - name: id
        in: path
        description: The identifier of the Product to clone
        required: true
        schema:
          type: string
      - name: isDeepCloneObject
        in: query
        description: Should deep clone object
        schema:
          type: boolean
      - name: excludeObjects
        in: query
        description: Objects to exclude from deep cloning
        schema:
          type: array
          items:
            type: string
      requestBody:
        description: Override fields with field name and value
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          text/json:
            schema:
              type: object
              additionalProperties: {}
          application/*+json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        '201':
          description: Created
        '202':
          description: Accepted
        '404':
