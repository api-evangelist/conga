openapi: 3.2.0
info:
  title: Conga Products API
  version: 1.0.0
  description: 'Operations tagged Products across 3 of this provider''s published API definitions: conga-administration.json, conga-asset.json, conga-catalog.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://rls.congacloud.com/api/revenue-admin/v1
- url: https://rls.congacloud.com
- url: https://preview-rls09.congacloud.com
- url: https://rls.congacloud.com/api/catalog/v1
tags:
- name: Products
paths:
  /products:
    delete:
      tags:
      - Products
      summary: Delete multiple products
      description: Deletes multiple products.
      requestBody:
        description: The list of products to delete
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Product'
            example:
            - Id: Id of the record to delete
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Product'
          application/*+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: OK
      security:
      - Bearer: []
    get:
      tags:
      - Products
      summary: Retrieve the collection of products
      description: Retrieves the collection of all the products.
      parameters:
      - name: filter
        in: query
        description: Optional filter parameters
        schema:
          type: array
          items:
            type: string
      - name: sort
        in: query
        description: Optional sort parameter
        schema:
          type: string
      - name: page
        in: query
        description: Page number
        schema:
          type: integer
          format: int32
          default: 1
      - name: limit
        in: query
        description: Number of items per page
        schema:
          type: integer
          format: int32
          default: 50
      - name: includes
        in: query
        description: Optional related entities to include
        schema:
          type: array
          items:
            type: string
      - name: field
        in: query
        description: Pass Comma separated mulitple fields
        schema:
          type: array
          items:
            type: string
      - name: filterExpression
        in: query
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: OK
        '204':
          description: No Content
      security:
      - Bearer: []
    patch:
      tags:
      - Products
      summary: Update multiple products
      description: Updates multiple products.
      requestBody:
        description: The list of products with updated data
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                additionalProperties: {}
            example:
            - Name: Name of the product
              ConfigurationType: Standalone
              Description: Product description
              Family: Product Family
              IsActive: true
              ProductType: Type of the product
              IsCustomizable: true
              Id: Id of the record
          text/json:
            schema:
              type: array
              items:
                type: object
                additionalProperties: {}
          application/*+json:
            schema:
              type: array
              items:
                type: object
                additionalProperties: {}
      responses:
        '200':
          description: OK
      security:
      - Bearer: []
    post:
      tags:
      - Products
      summary: Create multiple products
      description: Creates multiple product.
      requestBody:
        description: The list of products to create
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Product'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Product'
          application/*+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Product'
      responses:
        '200':
          description: OK
      security:
      - Bearer: []
    servers:
    - url: https://rls.congacloud.com/api/revenue-admin/v1
  /products/{Id}:
    delete:
      tags:
      - Products
      summary: Delete a single product by its identifier
      description: Deletes a single product by its identifier.
      parameters:
      - name: Id
        in: path
        description: The identifier of the product to delete
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      security:
      - Bearer: []
    get:
      tags:
      - Products
      summary: Retrieve a single product by its identifier
      description: Retrieves a single product by its identifier.
      parameters:
      - name: Id
        in: path
        description: The identifier of the product
        required: true
        schema:
          type: string
      - name: includes
        in: query
        description: Optional related entities to include
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
      security:
      - Bearer: []
    patch:
      tags:
      - Products
      summary: Update a single product
      description: Updates a single product.
      parameters:
      - name: Id
        in: path
        description: The identifier of the product to update
        required: true
        schema:
          type: string
      requestBody:
        description: The updated data of the product
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
            example:
              Name: Name of the product
              ConfigurationType: Standalone
              Description: Product description
              Family: Product Family
              IsActive: true
              ProductType: Type of the product
              IsCustomizable: true
          text/json:
            schema:
              type: object
              additionalProperties: {}
          application/*+json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        '200':
          description: OK
      security:
      - Bearer: []
    servers:
    - url: https://rls.congacloud.com/api/revenue-admin/v1
