openapi: 3.2.0
info:
  title: Administration Open Search Sync Audit API
  version: 1.0.0
servers:
- url: https://rls.congacloud.com/api/revenue-admin/v1
security:
- Bearer: []
tags:
- name: OpenSearchSyncAudit
paths:
  /open-search-sync-audit:
    get:
      tags:
      - OpenSearchSyncAudit
      summary: Get OpenSearchSyncAudit Records
      description: Retrieves OpenSearch synchronization audit records with optional filtering. Supports filtering by entity name, record IDs, and date range (start and end dates). Results are paginated with 500 records per page. Returns audit records that track synchronization events between the system and OpenSearch.
      parameters:
      - name: entityName
        in: query
        schema:
          type: string
      - name: recordIds
        in: query
        schema:
          type: array
          items:
            type: string
      - name: startDate
        in: query
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 1
      responses:
        '200':
          description: OK
        '204':
          description: No Content
components:
  securitySchemes:
    Bearer:
      type: apiKey
      description: Please insert JWT with Bearer into field
      name: Authorization
      in: header
