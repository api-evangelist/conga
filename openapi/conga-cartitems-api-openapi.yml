        in: path
        description: The unique identifier of the cart.
        required: true
        schema:
          type: string
      requestBody:
        description: Primary Line Numbers to Reprice
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
                format: int32
          text/json:
            schema:
              type: array
              items:
                type: integer
                format: int32
          application/*+json:
            schema:
              type: array
              items:
                type: integer
                format: int32
