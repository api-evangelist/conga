                  EffectiveEndDate: '0001-01-01T00:00:00'
                  ConversionRate: 10
                  Scale: 2
                  Id: null
                  Name: null
                  CreatedBy: null
                  CreatedDate: '0001-01-01T00:00:00'
                  ModifiedBy: null
                  ModifiedDate: '0001-01-01T00:00:00'
                  ExternalId: null
                  ETag: null
                - SourceCurrency: EUR
                  TargetCurrency: IDR
                  EffectiveStartDate: '0001-01-01T00:00:00'
                  EffectiveEndDate: '0001-01-01T00:00:00'
                  ConversionRate: 5
                  Scale: 2
                  Id: null
                  Name: null
                  CreatedBy: null
                  CreatedDate: '0001-01-01T00:00:00'
                  ModifiedBy: null
                  ModifiedDate: '0001-01-01T00:00:00'
                  ExternalId: null
                  ETag: null
                StatusCode: OK
        '400':
          description: Found unknown field(s)
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringAPIResponse'
              example:
                Success: false
                Errors:
                - Message: Internal server error occurred. Please contact admin.
                StatusCode: OK
    put:
      tags:
      - Currency Admin
      summary: Update multiple currency rates
      description: Update multiple currency rates and returns the request status.
      requestBody:
        description: Currency rates information list
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                additionalProperties: {}
          text/json:
            schema:
              type: array
              items:
                type: object
                additionalProperties: {}
          application/*+json:
