  /api/currency-management/v1/currency-rates/{id}:
    delete:
      tags:
      - Currency Admin
      summary: Delete currency rate by ID
      description: Deletes a currency rate.
      parameters:
      - name: id
        in: path
        description: Currency rate ID
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooleanAPIResponse'
        '400':
          description: Found unknown field(s)
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringAPIResponse'
              example:
                Success: false
                Errors:
                - Message: Internal server error occurred. Please contact admin.
                StatusCode: OK
    get:
      tags:
      - Currency Admin
      summary: Retrieve a currency rate by ID
      description: Retrieves a currency rate for the given currency rate ID.
      parameters:
      - name: id
        in: path
        description: Currency rate ID
        required: true
        style: simple
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyRateResponseAPIResponse'
              example:
                Success: true
                Data:
                  SourceCurrency: USD
                  TargetCurrency: INR
                  EffectiveStartDate: '0001-01-01T00:00:00'
                  EffectiveEndDate: '0001-01-01T00:00:00'
                  ConversionRate: 10
                  Scale: 2
                  Id: null
                  Name: null
                  CreatedBy: null
                  CreatedDate: '0001-01-01T00:00:00'
                  ModifiedBy: null
                  ModifiedDate: '0001-01-01T00:00:00'
                  ExternalId: null
                  ETag: null
                StatusCode: OK
        '400':
          description: Found unknown field(s)
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringAPIResponse'
              example:
                Success: false
                Errors:
                - Message: Internal server error occurred. Please contact admin.
                StatusCode: OK
    put:
      tags:
      - Currency Admin
      summary: Update a currency rate
      description: Updates a currency rate for the given currency rate ID.
      parameters:
      - name: id
        in: path
        description: Currency rate ID
        required: true
        style: simple
        schema:
          type: string
      requestBody:
        description: Currency rate information
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          text/json:
            schema:
              type: object
              additionalProperties: {}
          application/*+json:
