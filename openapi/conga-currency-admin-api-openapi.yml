openapi: 3.2.0
info:
  title: Conversion Management Currency Admin API
  version: v1
servers:
- url: https://rls.congacloud.com
- url: https://preview-rls09.congacloud.com
security:
- bearerAuth: []
tags:
- name: Currency Admin
paths:
  /api/currency-management/v1/currency-rates:
    get:
      tags:
      - Currency Admin
      summary: Get all currency rates
      description: Returns all currency rates that meet the criteria.
      parameters:
      - name: criteria
        in: query
        description: 'Search criteria for the currency rates. **For example**: SourceCurrency = ''USD''. <p>**Note**: The criteria field (in this case, SourceCurrency) should be indexed.</p>'
        style: form
        schema:
          type: string
      - name: sortField
        in: query
        description: 'Field name for sorting. **For example**: EffectiveEndDate. <p>**Note**: The sort field (in this case, EffectiveEndDate) should be indexed or sortable.</p>'
        style: form
        schema:
          type: string
      - name: sortDirection
        in: query
        description: 'Sort direction (Ascending or Descending) of the data. For example: ASC or DESC. <p>**Note**: The default sort order is **DESC** if the sort field parameter is specified.</p>'
        style: form
        schema:
          type: string
      - name: pageSize
        in: query
        description: The number of records to display on each page.
        style: form
        schema:
          type: integer
          format: int32
      - name: pageNumber
        in: query
        description: The page number of the result set to view.
        style: form
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyRateListAPIResponse'
              example:
                Success: true
                RecordCount: 2
                Data:
                - SourceCurrency: USD
                  TargetCurrency: INR
                  EffectiveStartDate: '2023-02-25T00:00:00'
                  EffectiveEndDate: '2023-03-25T00:00:00'
                  ConversionRate: 80
                  Id: null
                  Name: null
                  CreatedBy: null
                  CreatedDate: '0001-01-01T00:00:00'
                  ModifiedBy: null
                  ModifiedDate: '0001-01-01T00:00:00'
                  ExternalId: null
                  ETag: null
                - SourceCurrency: USD
                  TargetCurrency: INR
                  EffectiveStartDate: '2023-04-25T00:00:00'
                  EffectiveEndDate: '2023-05-25T00:00:00'
                  ConversionRate: 81
                  Id: null
                  Name: null
                  CreatedBy: null
                  CreatedDate: '0001-01-01T00:00:00'
                  ModifiedBy: null
                  ModifiedDate: '0001-01-01T00:00:00'
                  ExternalId: null
                  ETag: null
                StatusCode: OK
        '400':
          description: Found unknown field(s)
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringAPIResponse'
              example:
                Success: false
                Errors:
                - Message: Internal server error occurred. Please contact admin.
                StatusCode: OK
    post:
      tags:
      - Currency Admin
      summary: Add a new currency rate
      description: Creates a new currency rate.
      requestBody:
        description: Currency rate information
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrencyRate'
          text/json:
            schema:
              $ref: '#/components/schemas/CurrencyRate'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CurrencyRate'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyRateAPIResponse'
              example:
                Success: true
                Data:
                  SourceCurrency: USD
                  TargetCurrency: INR
                  EffectiveStartDate: '0001-01-01T00:00:00'
                  EffectiveEndDate: '0001-01-01T00:00:00'
                  ConversionRate: 10
                  Scale: 2
                  Id: null
                  Name: null
                  CreatedBy: null
                  CreatedDate: '0001-01-01T00:00:00'
                  ModifiedBy: null
                  ModifiedDate: '0001-01-01T00:00:00'
                  ExternalId: null
                  ETag: null
                StatusCode: OK
        '400':
          description: Found unknown field(s)
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringAPIResponse'
              example:
                Success: false
                Errors:
                - Message: Internal server error occurred. Please contact admin.
                StatusCode: OK
  /api/currency-management/v1/currency-rates/bulk:
    post:
      tags:
      - Currency Admin
      summary: Add multiple currency rates
      description: Creates multiple currency rates.
      requestBody:
        description: Currency rates information list
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CurrencyRate'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CurrencyRate'
          application/*+json:
