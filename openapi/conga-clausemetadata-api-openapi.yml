          items:
            $ref: '#/components/schemas/Apttus.XAuthor.Core.Model.ClauseTypes'
        exceptions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Apttus.XAuthor.Core.Model.Exception'
        riskRating:
          type:
