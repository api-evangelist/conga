openapi: 3.2.0
info:
  title: X-Author Clause Metadata API
  version: v1
  description: This class contains API endpoints for template clause metadata
servers:
- url: https://xauthor-prod-rls10.congacloud.com
- url: https://xauthor-preview-rls09.congacloud.com
security:
- bearerAuth: []
tags:
- name: ClauseMetadata
  description: This class contains API endpoints for template clause metadata
paths:
  /api/xauthor/v1/clauses/mark/metadata/{contractId}:
    get:
      tags:
      - ClauseMetadata
      summary: Get mark clause metadata
      parameters:
      - name: contractId
        in: path
        description: The contract's Id
        required: true
        allowEmptyValue: true
        schema:
          type:
          - string
          - 'null'
          description: The contract's Id
          default: ''
      - name: OrgType
        in: header
        required: true
        schema:
          type: string
          default: RLP
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Apttus.XAuthor.Core.Model.AgreementClauseFilterMetadata'
            application/json:
              schema:
                $ref: '#/components/schemas/Apttus.XAuthor.Core.Model.AgreementClauseFilterMetadata'
            text/json:
              schema:
                $ref: '#/components/schemas/Apttus.XAuthor.Core.Model.AgreementClauseFilterMetadata'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '500':
          description: Server Error
  /api/xauthor/v1/clauses/metadata:
    get:
      tags:
      - ClauseMetadata
      summary: Get a template clause's metadata
      parameters:
      - name: OrgType
        in: header
        required: true
        schema:
          type: string
          default: RLP
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Apttus.XAuthor.Core.Model.ClauseFilterMetadata'
            application/json:
              schema:
                $ref: '#/components/schemas/Apttus.XAuthor.Core.Model.ClauseFilterMetadata'
            text/json:
              schema:
                $ref: '#/components/schemas/Apttus.XAuthor.Core.Model.ClauseFilterMetadata'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '500':
          description: Server Error
