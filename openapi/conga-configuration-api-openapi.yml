    SignConfig:
      type: object
      properties:
        Configuration:
          $ref: '#/components/schemas/Configuration_2'
        State:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
            - 'null'
      additionalProperties: false
    ErrorDetail_2:
      type: object
      properties:
        Id:
          type:
