      properties:
        SignProvider:
          type:
          - string
          - 'null'
        DisplayName:
          type:
          - string
          - 'null'
        Value:
          type:
          - string
          - 'null'
        Default:
          type: boolean
        Active:
          type: boolean
        LastUpdated:
