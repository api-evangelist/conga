    post:
      tags:
      - External Endpoint Configuration
      summary: Create endpoint configuration
      description: Creates a new external endpoint configuration by defining its URL, HTTP method, headers, parameters, request/response metadata, and linked authentication.
      requestBody:
        description: The external endpoint configuration request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExternalEndpointConfigurationRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateExternalEndpointConfigurationRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateExternalEndpointConfigurationRequest'
      responses:
        '201':
          description: Created
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/StringAPIResponse'
