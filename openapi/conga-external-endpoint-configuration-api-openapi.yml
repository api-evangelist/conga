  /api/external-endpoint-config/v1/endpoints/validate:
    post:
      tags:
      - External Endpoint Configuration
      summary: Validate external endpoint schema
      description: Validates the request and response metadata of an external endpoint against the expected JSON schema to ensure correct structure before execution.
      requestBody:
        description: The external endpoint metadata request to validate.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HttpEndpointMetadataRequest'
            example:
              RequestBody:
                Name: Record1
                Id: 123
                Account:
                  Name: Conga
              ResponseBody:
                Success: true
                Data:
                  Id: f5e5857a-d27a-42b6-8291-874b158e5f87
          text/json:
            schema:
              $ref: '#/components/schemas/HttpEndpointMetadataRequest'
            example:
              RequestBody:
                Name: Record1
                Id: 123
                Account:
                  Name: Conga
              ResponseBody:
                Success: true
                Data:
                  Id: f5e5857a-d27a-42b6-8291-874b158e5f87
          application/*+json:
            schema:
              $ref: '#/components/schemas/HttpEndpointMetadataRequest'
            example:
              RequestBody:
                Name: Record1
                Id: 123
                Account:
                  Name: Conga
              ResponseBody:
                Success: true
                Data:
                  Id: f5e5857a-d27a-42b6-8291-874b158e5f87
