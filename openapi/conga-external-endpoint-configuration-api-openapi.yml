      - External Endpoint Configuration
      summary: Retrieve all endpoint configurations
      description: Retrieves all stored authentication configurations used to connect to external service endpoints.
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ExternalEndpointConfigurationInfoListAPIResponse'
            application/json:
              schema:
