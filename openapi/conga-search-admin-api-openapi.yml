            $ref: '#/components/schemas/SearchObjectSyncStatus'
      additionalProperties: false
    SearchSetting:
      type: object
      properties:
        Id:
          type:
          - string
          - 'null'
        Name:
          type:
          - string
          - 'null'
        CreatedBy:
          $ref: '#/components/schemas/LookupObject'
        CreatedDate:
          type: string
          format: date-time
        ModifiedBy:
          $ref: '#/components/schemas/LookupObject'
        ModifiedDate:
          type: string
          format: date-time
        ExternalId:
          type:
          - string
          - 'null'
        ETag:
          type:
          - string
          - 'null'
        ObjectName:
          type:
          - string
          - 'null'
          description: Name of the object
        EnableAllSearchFields:
          type: boolean
          description: Enable All Search Fields from metadata.
        IsGlobalSearchEnabled:
          type: boolean
          description: Enable Global Search
          readOnly: true
        SearchFields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SearchField'
          description: Search Fields - Perform search on SearchFields set.
        GlobalSearchFields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/GlobalSearchField'
          description: Global Search Fields - Perform search on GlobalSearchFields set.
        TypeAheadFields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TableField'
          description: TypeAhead Fields - Provide suggestions for users as they type in a query and return list of fields in result.
        SelectFields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TableField'
          description: Select Fields - users as they type in a query and return list of fields in result.
        IgnoreFields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TableField'
          description: Ignore fields - should not return in results.
        PriorityFields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PriorityField'
          description: Based on Priority fields - result should be sort.
      additionalProperties: {}
      description: Search Setting - Define search configuration for Object.
    SearchObjectSyncStatus:
      type: object
      properties:
        ObjectName:
          type:
          - string
          - 'null'
        TotalCount:
          type: integer
          format: int32
        SuccessCount:
          type: integer
          format: int32
        FailedCount:
          type: integer
          format: int32
        ObjectDataSyncStatus:
