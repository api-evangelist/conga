    PriorityField:
      type: object
      properties:
        FieldName:
          type:
          - string
          - 'null'
        Priority:
          type: integer
          format: int32
      additionalProperties: false
    SearchRbacMigrationResponse:
      type: object
      properties:
        TrackingId:
          type:
          - string
          - 'null'
          description: Tracking ID for the migration
        UpdateSearchSetting:
          type: boolean
          description: Update search setting flag
        SearchSettingChanges:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SearchRbacMigrationDetail'
          description: Search setting changes
      additionalProperties: false
      description: Search Rbac Migration response
    SearchObjectDataSyncStatus:
      type: object
      properties:
        Status:
          type:
          - string
          - 'null'
        Error:
          type:
          - string
          - 'null'
      additionalProperties: false
    SearchDataSyncStatusResponse:
      type: object
      properties:
        TrackingId:
          type:
          - string
          - 'null'
        EventType:
          type:
          - string
          - 'null'
        ObjectSyncStatus:
          type:
          - array
          - 'null'
