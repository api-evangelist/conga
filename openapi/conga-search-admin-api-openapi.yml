openapi: 3.2.0
info:
  title: Search Admin API
  version: v1
servers:
- url: https://rls.congacloud.com
security:
- Bearer: []
tags:
- name: Search Admin
paths:
  /api/search/v1/datasyncstatus:
    get:
      tags:
      - Search Admin
      summary: Get the data sync status of all objects
      description: Lists all objects and their data sync status (Elasticsearch and database).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSyncStatusResponseListAPIResponse'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /api/search/v1/datasyncstatus/{trackingId}:
    get:
      tags:
      - Search Admin
      summary: Get data sync status by tracking ID
      description: Gets the data sync status for a specific tracking ID.
      parameters:
      - name: trackingId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchDataSyncStatusResponseAPIResponse'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /api/search/v1/document/index:
    post:
      tags:
      - Search Admin
      summary: Index a document
      description: Creates an index for the specified document.
      requestBody:
        description: The ID of the document referring to the document store.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchDocumentIndexRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/SearchDocumentIndexRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SearchDocumentIndexRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringAPIResponse'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /api/search/v1/global-search-data-types:
    get:
      tags:
      - Search Admin
      summary: Get field data types supported in global search configuration.
      description: Returns field data types supported in global search configuration.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringListAPIResponse'
        '500':
          description: Internal Server Error
  /api/search/v1/rbac-migrate:
    post:
      tags:
      - Search Admin
      summary: Migrate Search RBAC settings
      description: Migrates Search RBAC settings by identifying missing RBAC fields in search settings and publishing a migration message if required.
      parameters:
      - name: updateSearchSetting
        in: query
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchRbacMigrationResponseAPIResponse'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /api/search/v1/resyncdata:
    post:
      tags:
      - Search Admin
      summary: Resync data for objects except Document
      description: "Resync data of objects which have mismatch (Elasticsearch and database) count and their data sync will be initialized.\n            Document object will not be processed here. to sync data of Documents, trigger manually using `api/search/v1/{objectName}/resyncdata`"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringAPIResponse'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /api/search/v1/setting:
    get:
      tags:
      - Search Admin
      summary: Get all search settings
      description: Retrieves all objects' search settings.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchSettingAPIResponse'
              example:
                Success: true
                Data:
                  ObjectName: SampleObjectName
                  EnableAllSearchFields: false
                  IsGlobalSearchEnabled: true
                  SearchFields:
                  - FieldName: SearchFields
                    Source: None
                  GlobalSearchFields:
                  - FieldName: GlobalSearchField
                  TypeAheadFields:
                  - FieldName: TypeAheadFieldName
                  SelectFields:
                  - FieldName: SearchField
                  IgnoreFields: []
                  PriorityFields:
                  - FieldName: PriorityField
                    Priority: 1
                  Id: e6e8542a-dbab-4fd6-986a-915bb3ada27c
                  Name: SampleName
                  CreatedBy: null
                  CreatedDate: '0001-01-01T00:00:00'
                  ModifiedBy: null
                  ModifiedDate: '0001-01-01T00:00:00'
                  ExternalId: null
                  ETag: null
                StatusCode: OK
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
    post:
      tags:
      - Search Admin
      summary: Create a search setting
      description: Creates a search setting for a particular object.
      requestBody:
        description: Search setting
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchSettingRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/SearchSettingRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SearchSettingRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchSettingAPIResponse'
              example:
                Success: true
                Data:
                  ObjectName: SampleObjectName
                  EnableAllSearchFields: false
                  IsGlobalSearchEnabled: true
                  SearchFields:
                  - FieldName: SearchFields
                    Source: None
                  GlobalSearchFields:
                  - FieldName: GlobalSearchField
                  TypeAheadFields:
                  - FieldName: TypeAheadFieldName
                  SelectFields:
                  - FieldName: SearchField
                  IgnoreFields: []
                  PriorityFields:
                  - FieldName: PriorityField
                    Priority: 1
                  Id: 24ae658e-b54f-4861-85a4-a4ed37fc29bb
                  Name: SampleName
                  CreatedBy: null
                  CreatedDate: '0001-01-01T00:00:00'
                  ModifiedBy: null
                  ModifiedDate: '0001-01-01T00:00:00'
                  ExternalId: null
                  ETag: null
                StatusCode: OK
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /api/search/v1/setting/{objectName}:
    delete:
      tags:
      - Search Admin
      summary: Delete object search setting
      description: Deletes the search setting for a given object name.
      parameters:
      - name: objectName
        in: path
        description: Name of the object to delete the search setting from.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringAPIResponse'
              example:
                Success: true
                Data: true
                StatusCode: OK
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
    put:
      tags:
      - Search Admin
      summary: Update object search setting
      description: Updates the search setting for a given object name.
      parameters:
      - name: objectName
        in: path
        description: Name of the object for which the search setting shall be updated.
        required: true
        schema:
          type: string
      - name: forceToUpdateSearchSetting
        in: query
        description: ''
        schema:
          type: boolean
          default: false
      requestBody:
        description: Search setting
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchSettingRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/SearchSettingRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/SearchSettingRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringAPIResponse'
              example:
                Success: true
                Data: true
                StatusCode: OK
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /api/search/v1/{objectName}/datasyncstatus:
    get:
      tags:
      - Search Admin
      summary: Get data sync status of an object
      description: Gets data sync status (Elasticsearch and database) of the given object.
      parameters:
      - name: objectName
        in: path
        description: Name of the object for which the data sync status to be checked.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSyncStatusResponseAPIResponse'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /api/search/v1/{objectName}/resyncdata:
    post:
      tags:
      - Search Admin
      summary: Resync data for an object
      description: Resync data of an object which have mismatch (Elasticsearch and database) count and their data sync will be initialized.
      parameters:
      - name: objectName
        in: path
        required: true
        schema:
          type: string
      - name: forceToSyncData
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringAPIResponse'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
