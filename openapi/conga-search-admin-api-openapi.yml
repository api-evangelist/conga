      additionalProperties: false
    SearchDocumentIndexRequest:
      type: object
      properties:
        DocumentId:
          type:
          - string
          - 'null'
          description: ID of the document that refers to document store.
        Version:
          type:
          - string
          - 'null'
      additionalProperties: false
      description: Search Document Index Request
    DataSyncStatus:
      enum:
      - Error
      - InProgress
      - Completed
      - NotStarted
      type: string
    ErrorDetail:
      type: object
      properties:
        Message:
          type:
          - string
          - 'null'
      additionalProperties: false
    SearchRbacMigrationDetail:
      type: object
      properties:
        ObjectName:
          type:
          - string
          - 'null'
        SearchFieldsAdded:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    SearchSettingRequest:
