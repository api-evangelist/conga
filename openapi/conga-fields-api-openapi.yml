          text/json:
            schema:
              $ref: '#/components/schemas/Conga.XAuthor.Model.Model.Request.FieldValidationV2Request'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Conga.XAuthor.Model.Model.Request.FieldValidationV2Request'
      responses:
        '200':
          description: Success
          content:
            text/plain:
