        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiResourceCreateRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ApiResourceCreateRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ApiResourceCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiResourceResponseExample'
              example:
                Success: true
                Data:
                  Name: sampleApiResource
                  CreatedBy: null
                  CreatedOn: '0001-01-01T00:00:00'
