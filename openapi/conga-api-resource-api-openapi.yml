          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllApiResourceResponseExample'
              example:
                Success: true
                Data:
                - Name: sampleApiResource
                  CreatedBy: null
                  CreatedOn: '0001-01-01T00:00:00'
                  ModifiedOn: '0001-01-01T00:00:00'
