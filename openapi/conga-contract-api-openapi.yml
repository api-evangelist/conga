paths:
  /api/clm/v1/contracts:
    delete:
      tags:
      - Contract
      summary: Delete contracts
      description: Permanently deletes the contract records of the provided contract IDs from the system.
      requestBody:
        description: List of contract IDs to be deleted
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        '200':
          description: The given contract IDs are deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringResultStatusDictionaryAPIResponse'
              example:
                Success: true
                Data:
                  64608ac0-f8d6-482e-8585-cf7f2cdb0b7b: Success
                  d2fd6dcd-c28c-44ca-9961-b01fc00cbc6a: Success
