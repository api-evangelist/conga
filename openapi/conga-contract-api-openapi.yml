                Data: null
                Warnings: null
                Errors:
                - Id: null
                  Message: Internal server error occurred. Please contact admin.
    post:
      tags:
      - Contract
      summary: Create a contract record
      description: "Creates a contract record in CLM. Name and Record Type are the required fields to create a contract. \n\nCLM auto-populates the system fields, such as Status Category and Status fields, which help identify the current stage of the contract lifecycle.\n\nThe Status Category and Status fields are set to \"Requested\". The logged-in user is added to the RecordOwner field by default. \n\nYou can introduce these additional and custom fields to the contract.\n* Name \n* Account \n* RecordType \n* RecordOwner \n* Status \n* StatusCategory \n* Id \n* CreatedBy \n* CreatedDate \n* ModifiedBy \n* ModifiedDate \n* ExternalId \n* ActivatedBy \n* ActivatedDate \n* ContractCategory \n* ContractNumber \n* AmendmentEffectiveDate \n* AutoRenewConsent \n* AutoRenewTermMonths \n* AutoRenewalTerms \n* AutoRenewal \n* ContractEndDate \n* ContractNumber \n* ContractStartDate \n* Description \n* InitiationType \n* InternalRenewalNotificationDays \n* InternalRenewalStartDate \n* ParentContract \n* Perpetual \n* PrimaryContact \n* Opportunity \n* RemainingContractedDays \n* RenewalNoticeDate \n* RenewalNoticeDays \n* RetentionDate \n* RetentionPolicyId \n* Source \n* SpecialTerms \n* SubmitRequestMode \n* TermMonths \n* TerminationComments \n* TerminationDate \n* TerminationNoticeDays \n* TerminationNoticeIssueDate \n* TermType \n* TotalContractValue \n* ExecutedDate \n* Currency"
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
            examples:
              Auto Renew:
                value:
                  Name: Contract-Demo
                  Account:
                    Id: 0474fc7a-5914-4059-a412-e88afb581b7a
                    Name: Conga
                  RecordType: MSA
                  ContractCategory: Sales
                  TotalContractValue: 2000
                  ContractStartDate: '2023-01-01T00:00:00'
                  ContractEndDate: '2023-12-31T00:00:00'
                  TermType: Auto Renew
              Fixed Term:
                value:
                  Name: Contract-Demo
                  Account:
                    Id: 0474fc7a-5914-4059-a412-e88afb581b7a
                    Name: Conga
                  RecordType: MSA
                  ContractCategory: Sales
                  TotalContractValue: 2000
                  ContractStartDate: '2023-01-01T00:00:00'
                  ContractEndDate: '2023-12-31T00:00:00'
                  TermType: Fixed Term
              Perpetual:
                value:
                  Name: Contract-Demo
                  Account:
                    Id: 0474fc7a-5914-4059-a412-e88afb581b7a
                    Name: Conga
                  RecordType: MSA
                  ContractCategory: Sales
                  TotalContractValue: 2000
                  ContractStartDate: '2023-01-01T00:00:00'
                  TermType: Perpetual
              Coterminous:
                value:
                  Name: Contract-Demo
                  Account:
                    Id: 0474fc7a-5914-4059-a412-e88afb581b7a
                    Name: Conga
                  RecordType: MSA
                  ContractCategory: Sales
                  TotalContractValue: 2000
                  ParentAgreement:
                    Id: b88r9fgt-a155-69bc-5d99-60c854a1a4a3
                    Name: Parent Agreement
                  ContractStartDate: '2023-01-01T00:00:00'
                  TermType: Coterminous
              No Term Type:
                value:
                  Name: Contract-Demo
                  Account:
                    Id: 0474fc7a-5914-4059-a412-e88afb581b7a
                    Name: Conga
                  RecordType: MSA
                  ContractCategory: Sales
                  TotalContractValue: 2000
                  ContractStartDate: '2023-01-01T00:00:00'
                  ContractEndDate: '2023-12-31T00:00:00'
      responses:
        '200':
          description: Details of the created contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringObjectDictionaryAPIResponse'
              example:
                Success: true
                Data:
                  Name: Contract-Demo
