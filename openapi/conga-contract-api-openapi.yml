  /api/clm/v1/contracts/{contractId}/signstatus:
    put:
      tags:
      - Contract
      summary: Update a contract's signature status
      description: Updates a contract's signature status (signed, declined, or out for signature). For consumption by the eSign Service API.
      parameters:
      - name: contractId
        in: path
        description: ID of the contract to be updated
        required: true
        schema:
          type: string
      - name: signStatus
        in: query
        description: SIGNED or DECLINED or OUT FOR SIGNATURE
        schema:
          type: string
      requestBody:
        description: List of document IDs
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        '200':
          description: The sign status updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringAPIResponse'
              example:
                Success: true
                Data: Success
                Warnings: null
                Errors: null
        '400':
          description: The provided contract ID or sign status is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseError'
              example:
                Success: false
                Data: null
                Warnings: null
                Errors:
                - Id: null
                  Message: Error Message
        '500':
          description: Internal Server Error
