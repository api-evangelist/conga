      - 502
      - 503
      - 504
      - 505
      - 506
      - 507
      - 508
      - 510
      - 511
    HealthCheckSummary:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        additionalProperties: false
        properties:
          status:
            type:
            - string
            - 'null'
          serviceVersion:
            type:
            - string
            - 'null'
          componentHealthSummary:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/ComponentHealthCheckSummary'
          duration:
            type: number
            format: double
  securitySchemes:
    JWT:
      type: apiKey
      description: Provide oauth authentication
      name: Authorization
      in: header
