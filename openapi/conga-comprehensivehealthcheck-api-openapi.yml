openapi: 3.2.0
info:
  title: Conga Sign Comprehensive Health Check API
  version: 1.0.0
servers:
- url: https://rls.congacloud.com/api/sign
security:
- JWT: []
tags:
- name: ComprehensiveHealthCheck
paths:
  /v1/comprehensive:
    get:
      tags:
      - ComprehensiveHealthCheck
      summary: Checks for comprehensive health
      operationId: ComprehensiveHealthCheck_CheckComprehensiveHealth
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckSummary'
        '503':
          description: ''
      security:
      - JWT: []
components:
  schemas:
    BaseResponse:
      type: object
      x-abstract: true
      additionalProperties: false
      properties:
        statusCode:
          $ref: '#/components/schemas/HttpStatusCode'
    ComponentHealthCheckSummary:
      type: object
      additionalProperties: false
      properties:
        name:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        error:
          type:
          - string
          - 'null'
        duration:
          type: number
          format: double
    HttpStatusCode:
      type: integer
      description: ''
      x-enumNames:
      - Continue
      - SwitchingProtocols
      - Processing
      - EarlyHints
      - OK
      - Created
      - Accepted
      - NonAuthoritativeInformation
      - NoContent
      - ResetContent
      - PartialContent
