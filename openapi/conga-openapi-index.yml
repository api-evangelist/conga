description: >-
  Conga publishes a complete OpenAPI 3.0.1 definition for every operation on its
  ReadMe-hosted developer portal: each API reference page has a machine-readable
  markdown twin at <page>.md whose "# OpenAPI definition" block carries a
  self-contained OpenAPI document for that operation (info, servers, the single
  path, every referenced component schema, and the Bearer securityScheme). The
  portal ships no single downloadable spec file and the HTML pages answer 429 to
  non-browser clients, so the specs in this directory were assembled by fetching
  those published .md twins verbatim and merging the fragments by info.title.
  No content was authored, inferred or rewritten - every path, schema and
  description is Conga's own published text.
