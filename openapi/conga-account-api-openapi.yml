            schema:
              $ref: '#/components/schemas/AccountRequestExample'
            example: '[{"Name":"Conga Account","AccountNumber":"1111111111","AccountSource":"Account Source","BillingAddress":"Billing Address","BillingCity":"Billing City","ChannelProgramName":"Channel Program Name","Industry":"Communications","IsCustomerPortal":"false","IsPartner":true,"AnnualRevenue":111111,"BillingCountry":"Billing Country","BillingCountryCode":"Billing Country Code","BillingPostalCode":"Billing Postal Code","BillingState":"Billing State","BillingStreet":"Billing Street","ChannelProgramLevelName":"Channel ProgramLevel Name","Description":"Description","Fax":"Fax","Owner":{"Id":"Guid","Name":"User Name"},"Ownership":"Public","Parent":{"Id":"Guid","Name":"Account Name"},"Phone":"111111111","PhotoUrl":"https://testurl.com/1234","Rating":"Rating","ShippingAddress":"Shipping Address","ShippingCity":"Shipping City","ShippingCountry":"Shipping Country","ShippingCountryCode":"Shipping Country Code","ShippingPostalCode":"Shipping Postal Code","ShippingState":"Shipping State","ShippingStreet":"Shipping Street","Site":"Site","Type":"Type","Website":"https://testweb.com","PriceList":{"Id":"Guid","Name":"PriceList Name"}},{"Name":"Conga Account","AccountNumber":"1111111111","AccountSource":"Account Source","BillingAddress":"Billing Address","BillingCity":"Billing City","ChannelProgramName":"Channel Program Name","Industry":"Communications","IsCustomerPortal":"false","IsPartner":true,"AnnualRevenue":111111,"BillingCountry":"Billing Country","BillingCountryCode":"Billing Country Code","BillingPostalCode":"Billing Postal Code","BillingState":"Billing State","BillingStreet":"Billing Street","ChannelProgramLevelName":"Channel ProgramLevel Name","Description":"Description","Fax":"Fax","Owner":{"Id":"Guid","Name":"User Name"},"Ownership":"Public","Parent":{"Id":"Guid","Name":"Account Name"},"Phone":"111111111","PhotoUrl":"https://testurl.com/1234","Rating":"Rating","ShippingAddress":"Shipping Address","ShippingCity":"Shipping City","ShippingCountry":"Shipping Country","ShippingCountryCode":"Shipping Country Code","ShippingPostalCode":"Shipping Postal Code","ShippingState":"Shipping State","ShippingStreet":"Shipping Street","Site":"Site","Type":"Type","Website":"https://testweb.com","PriceList":{"Id":"Guid","Name":"PriceList Name"}}]'
      responses:
