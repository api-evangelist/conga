ry","ShippingCountryCode":"Shipping Country Code","ShippingPostalCode":"Shipping Postal Code","ShippingState":"Shipping State","ShippingStreet":"Shipping Street","Site":"Site","Type":"Type","Website":"https://testweb.com","PriceList":{"Id":"Guid","Name":"PriceList Name"}}]'
