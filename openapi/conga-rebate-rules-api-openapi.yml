openapi: 3.2.0
info:
  title: Rebate Administration Rebate Rules API
  version: 1.0.0
servers:
- url: https://rls.congacloud.com/api/rebates-admin/v1
security:
- Bearer: []
tags:
- name: Rebate Rules
paths:
  /rebates/{ParentId}/rules:
    delete:
      tags:
      - Rebate Rules
      summary: Delete rebate rules
      description: Deletes one or more rebate rules from the collection.
      parameters:
      - name: ParentId
        in: path
        description: The identifier of the parent rebate
        required: true
        schema:
          type: string
      requestBody:
        description: The list of records to delete
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/IncentiveRule'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/IncentiveRule'
          application/*+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/IncentiveRule'
      responses:
        '200':
          description: OK
    get:
      tags:
      - Rebate Rules
      summary: Retrieve rebate rules
      description: Retrieves a collection of rebate rules based on the parent rebate.
      parameters:
      - name: ParentId
        in: path
        description: The identifier of the parent rebate
        required: true
        schema:
          type: string
      - name: filter
        in: query
        description: An optional array of filters
        schema:
          type: array
          items:
            type: string
      - name: sort
        in: query
        description: An optional sort criteria
        schema:
          type: string
      - name: page
        in: query
        description: The page number for pagination
        schema:
          type: integer
          format: int32
          default: 1
      - name: limit
        in: query
        description: The maximum number of records per page
        schema:
          type: integer
          format: int32
          default: 50
      - name: includes
        in: query
        description: An optional array of included fields
        schema:
          type: array
          items:
            type: string
      - name: field
        in: query
        description: Pass Comma separated mulitple fields
        schema:
          type: array
          items:
            type: string
      - name: filterExpression
        in: query
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: OK
        '204':
          description: No Content
    patch:
      tags:
      - Rebate Rules
      summary: Update rebate rules
      description: Updates one or more rebate rules in the collection. Parent reassignment is not allowed.
      parameters:
      - name: ParentId
        in: path
        description: The identifier of the parent rebate
        required: true
        schema:
          type: string
      requestBody:
        description: The list of records to be updated
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                additionalProperties: {}
          text/json:
            schema:
              type: array
              items:
                type: object
                additionalProperties: {}
          application/*+json:
            schema:
              type: array
              items:
                type: object
                additionalProperties: {}
      responses:
        '200':
          description: OK
    post:
      tags:
      - Rebate Rules
      summary: Create rebate rules
      description: Adds one or more rebate rules to the collection. The parent rebate is automatically filled.
      parameters:
      - name: ParentId
        in: path
        description: The identifier of the parent rebate
        required: true
        schema:
          type: string
      requestBody:
        description: The list of rebate rules to add to the collection
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/IncentiveRule'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/IncentiveRule'
          application/*+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/IncentiveRule'
      responses:
        '200':
          description: OK
  /rebates/{ParentId}/rules/{Id}:
    delete:
      tags:
      - Rebate Rules
      summary: Delete a rebate rule
      description: Deletes a single rebate rule document based on the identifier and parent rebate.
      parameters:
      - name: ParentId
        in: path
        description: The identifier of the parent rebate
        required: true
        schema:
          type: string
      - name: Id
        in: path
        description: The identifier of the rebate rule
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
    get:
      tags:
      - Rebate Rules
      summary: Retrieve a rebate rule
      description: Retrieves a single rebate rule document based on the identifier and parent rebate.
      parameters:
      - name: ParentId
        in: path
        description: The identifier of the parent rebate
        required: true
        schema:
          type: string
      - name: Id
        in: path
        description: The identifier of the rebate rule
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '204':
          description: No Content
    patch:
      tags:
      - Rebate Rules
      summary: Update a rebate rule
      description: Updates a single rebate rule document based on the identifier and parent rebate.
      parameters:
      - name: ParentId
        in: path
        description: The identifier of the parent rebate
        required: true
        schema:
          type: string
      - name: Id
        in: path
        description: The identifier of the rebate rule
        required: true
        schema:
          type: string
      requestBody:
        description: The updated state of the rebate rule
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          text/json:
            schema:
              type: object
              additionalProperties: {}
          application/*+json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        '200':
          description: OK
components:
