        '500':
          description: Internal Server Error
    get:
      tags:
      - Conga Hooks Rules
      summary: Retrieve a service hooks rule by name
      description: Retrieves the service hooks rule details for the given name.
      parameters:
      - name: name
        in: path
        description: Service hooks rule name to get the rule details
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHooksRuleGetResponse'
              example:
                Success: true
                Data:
                  Name: Name
                  EventTypes: []
                  ObjectName: Name_Of_Object
                  IsActive: true
                  Condition: Condition_On_Which_Rule_Will_Get_executed
                  CustomCodeDetails:
                    Id: Project_Id
                    Parameters: null
                    MethodName: null
                    ClassName: Class_Name
                    ProjectName: Project_Name
                  ScheduleDetails: null
                  RuleType: DataChange
                  ModifiedOn: '0001-01-01T00:00:00'
