        '500':
          description: Internal Server Error
    patch:
      tags:
      - Conga Hooks Rules
      summary: Update a service hooks rule
      description: Validates and updates the service hooks rule and returns the updated rule information.
      parameters:
      - name: name
        in: path
        description: Service hooks rule name
        required: true
        schema:
          type: string
      requestBody:
        description: Service hooks rule details to be updated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceHooksRuleUpdateRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ServiceHooksRuleUpdateRequest'
          application/*+json:
