paths:
  /api/extensibility/v1/servicehooks/rules:
    get:
      tags:
      - Conga Hooks Rules
      summary: Retrieve all service hooks rules
      description: Returns service hooks rules that meet the parameter conditions.
      parameters:
      - name: criteria
        in: query
        description: 'Search criteria for the rule <p>**For Example**: `Name=''SampleRule''`.</p>'
        schema:
          type: string
      - name: pageSize
        in: query
        description: The number of records to display on each page
        schema:
          type: integer
          format: int32
      - name: pageNumber
        in: query
        description: The page number of the result set to view
        schema:
          type: integer
          format: int32
      - name: sortField
        in: query
        description: Field name for sorting
        schema:
          type: string
      - name: sortDirection
        in: query
        description: Sort direction of the result set <p>(ASC or DESC)</p>
        schema:
          $ref: '#/components/schemas/SortDirection'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceHooksRuleGetResponse'
              example:
                Success: true
                Data:
                - Name: Name
                  EventTypes:
                  - Update
                  ObjectName: Name_Of_Object
                  IsActive: true
                  Condition: Condition_On_Which_Rule_Will_Get_executed
                  CustomCodeDetails:
                    Id: Project_Id
                    Parameters: null
                    MethodName: null
                    ClassName: Name_Of_Class
                    ProjectName: Name_Of_Project
                  ScheduleDetails: null
                  RuleType: DataChange
                  ModifiedOn: '0001-01-01T00:00:00'
                - Name: Name
                  EventTypes:
                  - Update
                  ObjectName: Name_Of_Object
                  IsActive: true
                  Condition: null
                  CustomCodeDetails:
                    Id: Project_Id
                    Parameters:
                    - Parameters
                    MethodName: Name_Of_Method
                    ClassName: Name_Of_Class
                    ProjectName: Name_Of_Project
                  ScheduleDetails:
                    JobType: Cron
                    Frequency: Daily
                    ExecutionTimeUtc: '2026-08-14T00:04:15.9019949Z'
                  RuleType: Schedule
                  ModifiedOn: '0001-01-01T00:00:00'
                StatusCode: OK
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponseExampleAPIResponse'
              example:
                Success: false
                Data: null
                Errors:
                - Message: Bad Request Error Message
                StatusCode: BadRequest
                NextCursor: null
        '500':
          description: Internal Server Error
    post:
      tags:
      - Conga Hooks Rules
      summary: Create a new service hooks rule
      description: Validates and creates the data change or schedule rule and returns the rule information.
      requestBody:
        description: Service hooks rule details to be added.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceHooksRuleCreateRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/ServiceHooksRuleCreateRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ServiceHooksRuleCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHooksRuleCreateResponse'
              example:
                Success: true
                Data:
                  Name: Name
                  EventTypes:
                  - Update
                  ObjectName: Name_Of_Object
                  IsActive: true
                  Condition: Condition_Expression
                  CustomCodeDetails:
                    Id: null
                    Parameters: null
                    MethodName: null
                    ClassName: Name_Of_Class
                    ProjectName: Name_Of_Project
                  ScheduleDetails: null
                  RuleType: DataChange
                  ModifiedOn: '0001-01-01T00:00:00'
                StatusCode: OK
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorResponseExampleAPIResponse'
              example:
                Success: false
                Data: null
                Errors:
                - Message: Bad Request Error Message
                StatusCode: BadRequest
                NextCursor: null
        '500':
          description: Internal Server Error
  /api/extensibility/v1/servicehooks/rules/cancellation/settings:
    get:
      tags:
      - Conga Hooks Rules
      summary: Get service hooks cancellation token setting configuration
      description: Fetches service hooks cancellation token setting configuration details.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackCustomCodeSettingsResponseAPIResponse'
              example:
                Success: true
