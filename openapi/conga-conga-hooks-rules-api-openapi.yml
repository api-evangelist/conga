      tags:
      - Conga Hooks Rules
      summary: Delete a service hooks rule
      description: Validates and removes the given service hooks rule.
      parameters:
      - name: name
        in: path
        description: Service hooks rule name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringAPIResponse'
