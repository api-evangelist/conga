      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHooksRuleUpdateResponse'
              example:
                Success: true
                Data:
                  Name: Name
                  EventTypes:
                  - Update
                  ObjectName: Name_Of_Object
                  IsActive: true
                  Condition: Condition_Expression
                  CustomCodeDetails:
                    Id: null
                    Parameters: null
                    MethodName: null
                    ClassName: Name_Of_Class
                    ProjectName: Name_Of_Project
                  ScheduleDetails: null
                  RuleType: DataChange
                  ModifiedOn: '0001-01-01T00:00:00'
                StatusCode: OK
        '400':
          description: Bad Request
          content:
