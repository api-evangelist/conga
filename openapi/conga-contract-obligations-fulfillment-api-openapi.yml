    ContractObligationFulfillment:
      type: object
      properties:
        Id:
          type:
          - string
          - 'null'
        Name:
          type:
          - string
          - 'null'
        CreatedBy:
          $ref: '#/components/schemas/LookupObject'
        CreatedDate:
          type: string
          format: date-time
        ModifiedBy:
          $ref: '#/components/schemas/LookupObject'
        ModifiedDate:
          type: string
          format: date-time
        ExternalId:
          type:
          - string
          - 'null'
        ETag:
          type:
          - string
          - 'null'
        FulfillmentNumber:
          type:
          - string
          - 'null'
          description: Fulfillment Number
        AgreementObligation:
          type:
          - string
          - 'null'
          description: Reference to Agreement Obligation table
        FulfillmentNumberAuto:
          type:
          - string
          - 'null'
          description: Auto-generated fulfillment number (raw sequence from DB)
        DueDate:
          type:
          - string
          - 'null'
          description: 'Due Date

            Serialized Format: yyyy-MM-dd (e.g., "2027-03-01")

            The DateTime value is converted to a date-only string without time component.

            Accepts both yyyy-MM-dd format and ISO-8601 datetime on deserialization.'
          format: date-time
        FulfillmentDate:
          type:
          - string
          - 'null'
          description: FulfillmentDate
          format: date-time
        Status:
          type:
          - string
          - 'null'
          description: Fulfillment Status
        Assignee:
          $ref: '#/components/schemas/LookupObject'
        Reviewer:
          $ref: '#/components/schemas/LookupObject'
        AssigneeContact:
          $ref: '#/components/schemas/LookupObject'
        AssigneeSupplierContact:
          $ref: '#/components/schemas/LookupObject'
        ReviewerContact:
          $ref: '#/components/schemas/LookupObject'
        AssigneeType:
          type:
          - string
          - 'null'
          description: Assignee Type
        ReviewerType:
          type:
          - string
          - 'null'
          description: Reviewer Type
        AssigneeUserGroup:
          $ref: '#/components/schemas/LookupObject'
        ReviewerUserGroup:
          $ref: '#/components/schemas/LookupObject'
      additionalProperties: {}
      description: Model for Agreement Obligation Fulfillment
    ManageFulfillmentResponseQueryResponseAPIResponse:
      type: object
      properties:
        Success:
          type: boolean
          description: The state of the API response
        Data:
          $ref: '#/components/schemas/ManageFulfillmentResponseQueryResponse'
        Warnings:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/WarningDetail'
          description: Warning detail list for non-blocking issues
        Errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ErrorDetail'
          description: Error detail list in case of failure
      additionalProperties: false
      description: API Response Class
    FulfillmentAction:
      enum:
      - Submit
      - Accept
      - Reject
      - RequestInformation
      - Waive
      type: string
      description: Defines possible actions that can be performed on a contract obligation fulfillment
    ContractObligation:
