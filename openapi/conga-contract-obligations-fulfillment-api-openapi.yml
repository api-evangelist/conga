        Reviewer:
          $ref: '#/components/schemas/LookupObject'
        AssigneeContact:
          $ref: '#/components/schemas/LookupObject'
        AssigneeSupplierContact:
          $ref: '#/components/schemas/LookupObject'
        ReviewerContact:
          $ref: '#/components/schemas/LookupObject'
        DueDate:
          type:
          - string
          - 'null'
          description: Contract Obligation Due Date
          format: date-time
        Status:
          type:
          - string
          - 'null'
          description: Contract Obligation status (Active, Pending, Completed)
        PrintOnContract:
          type: boolean
          description: Contract Obligation Print On Contract
        Comments:
          type:
          - string
          - 'null'
          description: Contract Obligation Comments
        IsActive:
          type: boolean
          description: ContractObligation is Active
        Frequency:
          type:
          - string
          - 'null'
          description: Contract Obligation Frequency
        AccountableParty:
          type:
          - string
          - 'null'
          description: Accountable Party Internal or External
        Description:
          type:
          - string
          - 'null'
          description: Description
        Priority:
          type:
          - string
          - 'null'
          description: Priority
        AssigneeType:
          type:
          - string
          - 'null'
          description: Assignee Type
        ReviewerType:
          type:
          - string
          - 'null'
          description: Reviewer Type
        AssigneeUserGroup:
          $ref: '#/components/schemas/LookupObject'
        ReviewerUserGroup:
          $ref: '#/components/schemas/LookupObject'
        ObligationNumber:
          type:
          - string
          - 'null'
          description: Obligation Number
      additionalProperties: {}
      description: Model for Contract Obligation
    ContractObligationFulfillmentAPIResponse:
