          format: date-time
        ExternalId:
          type:
          - string
          - 'null'
        ETag:
          type:
          - string
          - 'null'
        Obligation:
          type:
          - string
          - 'null'
          description: Lookup to Obligation
        Agreement:
          type:
          - string
          - 'null'
          description: Lookup to Agreement
        AgreementClause:
          type:
          - string
          - 'null'
          description: Lookup to Agreement Clause
        ObligationType:
          type:
          - string
          - 'null'
          description: Lookup to Obligation Type
        Assignee:
