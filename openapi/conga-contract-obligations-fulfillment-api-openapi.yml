                      Name: Alice Johnson
                    AssigneeContact:
                      Id: a1234567-1234-1234-1234-123456789013
                      Name: Bob Williams
                    AssigneeSupplierContact:
                      Id: a1234567-1234-1234-1234-123456789016
                      Name: Supplier Contact
                    ReviewerUserGroup:
                      Id: b1234567-1234-1234-1234-123456789014
                      Name: Legal Review Group
                    AssigneeUserGroup:
