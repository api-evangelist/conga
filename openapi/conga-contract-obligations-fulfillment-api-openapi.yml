          description: Warning detail list for non-blocking issues
        Errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ErrorDetail'
          description: Error detail list in case of failure
      additionalProperties: false
      description: API Response Class
    StringObjectDictionaryQueryResponse:
      type: object
      properties:
        StatusCode:
          $ref: '#/components/schemas/HttpStatusCode'
        RecordCount:
          type:
          - integer
          - 'null'
          format: int64
        Data:
          type:
          - array
          - 'null'
          items:
            type: object
            additionalProperties: {}
        HasMoreRecords:
          type:
          - boolean
          - 'null'
        NextCursor:
          type:
          - string
          - 'null'
      additionalProperties: false
    APIResponseError:
      type: object
      properties:
        Success:
          type: boolean
          description: The state of the API response
        Data:
          type:
          - string
          - 'null'
          description: Generic data to return
        Warnings:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/WarningDetail'
          description: Warning detail list for non-blocking issues
        Errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ErrorDetail'
          description: Error detail list in case of failure
      additionalProperties: false
      description: API Response Error Class
    ManageFulfillmentResponse:
      type: object
      properties:
        Id:
          type:
          - string
          - 'null'
        Name:
          type:
          - string
          - 'null'
        FulfillmentNumber:
          type:
          - string
          - 'null'
          description: 'FulfillmentNumber - Fulfillment Number from AgreementObligationFulfillment

            Hyperlink to Obligation Fulfillment Details page'
        ObligationName:
          type:
          - string
          - 'null'
          description: ObligationName - The name of the associated obligation from AgreementObligation schema
        ObligationNumber:
          type:
          - string
          - 'null'
          description: ObligationNumber - Obligation Number from AgreementObligation schema
        Frequency:
          type:
          - string
          - 'null'
          description: Frequency - Obligation recurrence frequency from AgreementObligation schema
        AgreementObligation:
          type:
          - string
          - 'null'
          description: AgreementObligation - AGREEMENT_OBLIGATION ID to link back to the obligation details page
        Agreement:
          type:
          - string
          - 'null'
          description: Agreement
        ContractName:
          type:
          - string
          - 'null'
          description: Contract Name
        ObligationType:
          type:
          - string
          - 'null'
          description: ObligationType - Type of obligation from AgreementObligation schema
        Status:
          type:
          - string
          - 'null'
          description: Status - Fulfillment Status from AgreementObligationFulfillment schema
        Assignee:
          $ref: '#/components/schemas/LookupObject'
        Reviewer:
          $ref: '#/components/schemas/LookupObject'
        DueDate:
          type:
          - string
          - 'null'
          description: DueDate - Due date when the obligation has to be fulfilled from AgreementObligationFulfillment schema
          format: date-time
        FulfillmentDate:
          type:
          - string
          - 'null'
          description: FulfillmentDate - Actual date when the obligation was fulfilled from AgreementObligationFulfillment schema
          format: date-time
        Priority:
          type:
          - string
          - 'null'
          description: Priority - Priority level from AgreementObligation schema
        ReviewerContact:
