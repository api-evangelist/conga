          type:
          - string
          - 'null'
          description: Assignee Type - User , UserGroup
        ReviewerType:
          type:
          - string
          - 'null'
          description: Reviewer Type - User , UserGroup
      additionalProperties: false
      description: 'Model for Manage Fulfillment Listing Response

        BaseObject maps to: AgreementObligationFulfillment (primary object)

        Additional fields mapped from: AgreementObligation (fetched via AGREEMENT_OBLIGATION ID)'
    SortDirection:
      enum:
      - Ascending
      - Descending
      type: string
    ErrorDetail:
      type: object
      properties:
        Id:
          type:
          - string
          - 'null'
