generated: '2026-07-18'
method: searched
source: https://developer.conga.com/revenue/docs
description: >-
  Conga separates development and production environments with distinct hosts and
  rate limits. Development orgs are provisioned by Conga Dev Ops / Cloud Ops during
  onboarding rather than via public self-serve signup; access uses the same OAuth
  2.0 client_credentials flow as production against the region-specific login
  service. Conga does not publish self-serve test credentials, magic test values,
  or test cards.
environments:
- name: development
  api_host_example: https://rlp-dev.congacloud.io
  base_path: /api
  rate_limit: 25 requests/second
- name: production
  auth_hosts:
  - region: NA
    url: https://login-rls.congacloud.com
  - region: EU
    url: https://login.congacloud.eu
  - region: AU
    url: https://login.congacloud.au
  rate_limit: 100 requests/second
onboarding:
  self_serve: false
  note: >-
    Orgs and users must be onboarded to the Conga Platform with help from Conga
    Dev Ops or Cloud Ops before authenticating.
test_values:
  published: false
  note: No public test cards, magic identifiers, or sandbox tokens are documented.
