error_schemas:
  note: >-
    The specs do not use one error schema. Five distinct envelopes appear across
    the 31 services, which is the single clearest sign that the platform is an
    assembly of separately-built services rather than one designed API.
  shapes:
  - name: ErrorDetail
    specs: 17
    shape: '{ Message: string }'
    note: The most common - a bare message with no code and no machine-readable type.
  - name: ProblemDetails
    specs: 9
    shape: RFC 7807 fields (type/title/status/detail/instance)
    note: >-
      Nine services carry the ASP.NET Core ProblemDetails schema (5 as
      "ProblemDetails", 4 as "Microsoft.AspNetCore.Mvc.ProblemDetails"), but NOT
      ONE operation in the entire catalogue declares an
      application/problem+json response content type - every response is
      application/json, text/json or text/plain. The shape is RFC 7807, the media
      type is not, so a client cannot content-negotiate or detect problem
      documents.
  - name: Conga.Revenue.Catalog.API.Models.CatalogError
    specs: 1
    shape: '{ code: int32, message: string, timestamp: date-time, additionalDetails: any }'
    note: The only envelope in the catalogue carrying a numeric error code and a timestamp.
  - name: APIResponseError / ErrorApiResponse / ApiError
    specs: 2
    shape: Errors[] inside a Success/Data/Errors/Warnings envelope
    note: >-
      The platform's generic API response wrapper - Success, RecordCount, Data,
      Errors[], Warnings[], Profile, TotalTime, StatusCode, HasMoreRecords,
      NextCursor.
  - name: Errors / ErrorResult / ErrorDetailResponse / Error / Error2
    specs: 4
    shape: assorted one-off wrappers
rfc9457:
  conforms: false
  reason: >-
    No operation declares application/problem+json, no error carries a stable
    `type` URI, and there is no published registry of problem types. The
    RFC 7807-shaped ProblemDetails schema present in 9 specs is an artifact of the
    ASP.NET Core stack, not a published contract.
error_code_registry:
  published: false
  note: >-
    Conga publishes no enumerated error-code reference. Errors carry a free-text
    Message (or a service-local numeric `code` in Catalog only), so a client
    cannot branch on error identity without string-matching prose.
notes: >-
  Conga returns errors inline with the JSON:API error-object specification
  (http://jsonapi.org/format/#error-objects) per its prose documentation, while
  the OpenAPI documents show five different envelopes across the 31 services.
  Per-operation error detail is documented on each endpoint's reference page
  under developer.conga.com and is captured verbatim in openapi/.
