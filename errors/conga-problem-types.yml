status_classes:
- class: 2xx
  meaning: The request completed successfully.
- class: 4xx
  meaning: The request failed due to a problem with the request.
- class: 5xx
  meaning: The request failed due to a problem with Conga Revenue Cloud.
problems:
- status: 204
  title: No Content
  detail: Returned for a valid collection request that matched no records.
- status: 400
  title: Bad Request
  detail: >-
    Validation failures or invalid JSON in the request body. Returned for all
    other client errors not covered by a more specific status code.
- status: 401
  title: Unauthorized
  detail: An invalid or missing authentication token was provided.
- status: 429
  title: Too Many Requests
  detail: >-
    The request exceeded the allowed rate limits (100 req/s production,
    25 req/s development by default). See rate-limits/conga-rate-limits.yml.
notes: >-
  Conga returns errors inline with the JSON:API error-object specification
  (http://jsonapi.org/format/#error-objects). Per-operation error detail is
  documented on each endpoint's reference page under developer.conga.com.
