authentication:
  style: "OAuth 2.0 bearer token (Authorization: Bearer)"
  detail: authentication/conga-authentication.yml
media_types:
  request: application/json
  oauth_token_request: application/x-www-form-urlencoded
  file_upload: multipart/form-data
  response: application/json (including errors)
pagination:
  style: page-number
  params:
    page:
      type: integer
      default: 1
      max: 1000
      note: page cannot be used without also setting limit
    limit:
      type: integer
      default: 1000
      max: 10000
  empty_result_status: 204
  response_headers:
  - name: Content-Range
    describes: resource name, first item index, last item index, total record count
    example: "Products 1-10 / 200"
filtering:
  style: URI query filter functions
  param: filter
  combine: multiple filter params combined with logical AND
  operators: [eq, like, gt, ge, lt, le]
  example: "/products?filter=eq(ConfigurationType:'Standalone')&filter=eq(Active:true)"
  limitation: only base object attributes can be filtered
sorting:
  param: sort
  style: sort=asc(Field) / sort=desc(Field); multiple sort params supported
  example: "/categories?sort=asc(Name)&sort=asc(ProductCount)"
field_expansion:
  param: includes
  style: retrieve related resources inline (e.g. includes=prices&includes=categories)
  create: related resources can be created inline with parent in a single POST
  note: no hard limit, but heavy includes degrade performance; page beyond ~100 related records
idempotency:
  supported: false
  note: No idempotency-key header/contract is documented in the Conga developer docs.
error_envelope:
  format: json:api-style
  spec: http://jsonapi.org/format/#error-objects
  shape: '{ "errors": [ { "Source", "Title", "Detail", "Link" } ] }'
  detail: errors/conga-problem-types.yml
rate_limiting:
  default_production: 100 requests/second
  default_development: 25 requests/second
  exceeded_status: 429
  detail: rate-limits/conga-rate-limits.yml
versioning:
  scheme: uri-path
  pattern: /api/{service}/v1/...
  current: v1
  detail: lifecycle/conga-lifecycle.yml
upsert_semantics:
  supported: true
  style: dedicated bulk-upsert endpoints keyed on a customer identifier
  examples:
  - PUT /api/user-management/v1/users/bulk-upsert
  - PUT /api/user-management/v1/users/bulk-upsert-sync
  - PUT /api/user-management/v1/user-groups/bulk-upsert-usergroups
  external_id_field: ExternalId
  note: >-
    Conga has no Idempotency-Key header, but it does offer a real safe-retry
    path: upsert endpoints keyed on the caller's own record identifier. Where a
    resource has a bulk-upsert form, use it instead of POST-and-catch-duplicate.
    ExternalId is the most common cross-reference field in the catalogue
    (150 occurrences across the specs).
partial_success:
  status: 207
  operations_declaring_it: 38
  note: >-
    Bulk endpoints return 207 Multi-Status with per-record outcomes - created ids
    plus an error list for the records that failed validation. A client that
    treats 2xx as success will silently drop records.
async_operations:
  supported: true
  pattern: correlation id
  example: GET /v1/async-operation-status/{correlationId}  # Approvals service
  status_code: 202
  operations_declaring_202: 41
  note: >-
    Long-running work returns 202 with a correlation id; poll the service's
    async-operation-status endpoint. The pattern is not consistent across all 31
    services.
response_envelope:
  name: APIResponse
  shape: '{ Success, RecordCount, Data, Errors[], Warnings[], Profile, TotalTime, StatusCode, HasMoreRecords, NextCursor }'
  note: >-
    Several services wrap payloads in a generic platform envelope carrying both a
    HTTP-mirroring StatusCode and a Success boolean, plus a NextCursor field -
    cursor pagination exists in the envelope even though the documented pagination
    contract is page/limit. Not applied uniformly across services.
request_id_tracing:
  client_header: null
  response_header: null
  note: >-
    No request-id or correlation header is documented and none is declared in any
    of the 2,136 operations. The Kong gateway does return a `request_id` in its own
    404 bodies, but that is gateway-level, not an API contract.
response_headers_declared:
  count: 0
  note: >-
    Not one operation in the entire catalogue declares a response header - not
    Content-Range (which the prose docs document for pagination), not a rate-limit
    header, not Retry-After. Runtime signalling is invisible to any tool that
    reads only the specs.
media_type_inconsistency:
  note: >-
    Responses are declared as application/json (2,974), text/plain (629) and
    text/json (629). text/json is a .NET serialization artifact, not a registered
    media type; a strict client negotiating on Accept can miss those responses.
